<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Puits à explorer — Indiana Fraise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#12100e; --laiton:#c9a25e; --laiton-clair:#e6c98a; --creme:#e8dcc4; --creme-doux:#c8b895;
  --H:9000px;      /* hauteur totale de la scène */
  --sol:760px;     /* niveau du sol */
  --puitsL:240px;  /* largeur intérieure du puits */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050403;color:var(--creme);font-family:'EB Garamond',Georgia,serif;overflow:hidden;height:100%;overscroll-behavior:none;touch-action:none}
/* la page fait toute la hauteur : on fait défiler, la scène suit en douceur */
#espace{display:none}

/* ===== SCÈNE (fixe, déplacée par le script) ===== */
#scene{position:fixed;left:0;top:0;width:100%;height:var(--H);will-change:transform;z-index:1}
.ciel{position:absolute;left:0;right:0;top:0;height:var(--sol);
  background:linear-gradient(#0b1424 0%,#1b2a3f 45%,#3b3446 75%,#6a4a3a 100%)}
.etoile{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:scintille 3s ease-in-out infinite}
@keyframes scintille{0%,100%{opacity:.2}50%{opacity:1}}
.lune{position:absolute;top:70px;right:12%;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8e1,#e8d9a8 60%,#b8a878);box-shadow:0 0 60px 15px rgba(255,240,200,.25)}
.colline{position:absolute;bottom:0;left:-10%;width:120%;height:180px;background:#14130f;border-radius:50% 50% 0 0/100% 100% 0 0}
.titre{position:absolute;top:110px;left:0;right:0;text-align:center;padding:0 1rem;z-index:3}
.titre h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,7vw,4rem);color:var(--laiton-clair);
  text-shadow:0 4px 20px rgba(0,0,0,.7);letter-spacing:.02em}
.titre p{font-style:italic;font-size:clamp(1.05rem,3vw,1.3rem);color:var(--creme-doux);margin-top:.5rem}
.fleche{display:inline-block;margin-top:1rem;font-size:2rem;color:var(--laiton);animation:rebond 1.6s ease-in-out infinite}
@keyframes rebond{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}

/* champ de maïs, épouvantail, corbeaux, ombre */
.mais{position:absolute;top:calc(var(--sol) - 175px);height:190px;z-index:1;overflow:visible}
.mais.g{left:0;width:36%}.mais.d{right:0;width:34%}
.mais svg{width:100%;height:100%;display:block}
.tige{transform-origin:50% 100%;animation:vent 4s ease-in-out infinite}
@keyframes vent{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.epouv{position:absolute;top:calc(var(--sol) - 300px);left:16%;width:150px;height:260px;z-index:1;transform-origin:50% 100%;animation:epouv 6s ease-in-out infinite}
@keyframes epouv{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.corbeau{position:absolute;width:44px;height:26px;z-index:2}
.corbeau.pose{top:calc(var(--sol) - 262px);left:calc(16% + 108px);animation:envol 14s ease-in infinite}
@keyframes envol{0%,70%{transform:translate(0,0)}72%{transform:translate(10px,-20px)}100%{transform:translate(900px,-420px) scale(.6)}}
.corbeau.vol{top:180px;left:-60px;animation:traverse 18s linear infinite}
.corbeau.vol.b{top:260px;animation-delay:-9s;animation-duration:22s;transform:scale(.7)}
@keyframes traverse{to{left:110%}}
.corbeau .aileC{transform-origin:50% 60%;animation:bat .35s ease-in-out infinite alternate}
.ombre{position:absolute;top:calc(var(--sol) - 205px);right:7%;width:70px;height:200px;z-index:1;opacity:0;animation:ombre 11s ease-in-out infinite}
@keyframes ombre{0%,55%{opacity:0;transform:translateX(30px)}62%,74%{opacity:.9;transform:translateX(0)}80%,100%{opacity:0;transform:translateX(-40px)}}
.brumeChamp{position:absolute;top:calc(var(--sol) - 70px);left:-10%;width:120%;height:90px;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(200,200,215,.22),transparent 60%),radial-gradient(ellipse at 75% 60%,rgba(200,200,215,.18),transparent 60%);
  animation:brume 12s ease-in-out infinite}
@media(max-width:700px){.oeil{width:46vw !important;height:46vw !important}.mais.g{width:30%}.mais.d{width:26%}.epouv{left:2%;width:110px;height:190px;top:calc(var(--sol) - 225px)}
  .corbeau.pose{left:calc(2% + 78px);top:calc(var(--sol) - 196px)}.ombre{right:3%;width:50px;height:150px;top:calc(var(--sol) - 160px)}}

/* panne de lampe à mi-chemin */
body.panne #nuit{background:#000 !important;opacity:.98 !important}
body.panne #faisceau{opacity:0 !important}
body.panne #indy .led{opacity:.08 !important;animation:none}

/* les grands yeux dans la terre, de chaque côté du fond du puits */
.oeilT{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity 2.5s;pointer-events:none}
.oeilT.on{opacity:1}
.oeilT{mix-blend-mode:screen}
.oeilT img{width:100%;height:100%;display:block;transform-origin:50% 55%;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%)}
.oeilT.on img{animation:clignote 7s ease-in-out infinite}
.oeilT.d.on img{animation-delay:.08s}
@keyframes clignote{0%,46%,50%,88%,92%,100%{transform:scaleY(1)}48%,90%{transform:scaleY(.05)}}

/* terre en couches */
.terre{position:absolute;left:0;right:0;top:var(--sol);bottom:0;
  background:linear-gradient(#3d2a1a 0px,#4a3220 260px,#5a3d22 270px,#6b4a2a 900px,#7a5a3a 910px,#5e5040 2200px,
    #4a4440 2210px,#3c3a38 4200px,#2e2c2c 4210px,#252224 6500px,#1a1719 6510px,#0f0d0e 100%)}
.herbe{position:absolute;left:0;right:0;top:calc(var(--sol) - 14px);height:22px;
  background:repeating-linear-gradient(90deg,#2f4a22 0 6px,#3e5e2a 6px 9px,#2a4020 9px 14px);
  clip-path:polygon(0 40%,3% 0,6% 45%,9% 5%,12% 40%,15% 0,18% 45%,21% 10%,24% 40%,27% 0,30% 45%,33% 5%,36% 40%,39% 0,42% 45%,45% 10%,48% 40%,51% 0,54% 45%,57% 5%,60% 40%,63% 0,66% 45%,69% 10%,72% 40%,75% 0,78% 45%,81% 5%,84% 40%,87% 0,90% 45%,93% 10%,96% 40%,100% 0,100% 100%,0 100%)}
.caillou{position:absolute;border-radius:45% 55% 50% 50%;background:#6e6258;opacity:.55}

/* le puits */
.puits{position:absolute;top:calc(var(--sol) - 130px);bottom:380px;left:50%;width:calc(var(--puitsL) + 60px);margin-left:calc((var(--puitsL) + 60px) / -2);}
.mur{position:absolute;top:0;bottom:0;width:30px;background-color:#3a3029;background-repeat:repeat-y;background-size:30px auto;
  box-shadow:inset -6px 0 10px rgba(0,0,0,.45),inset 6px 0 10px rgba(0,0,0,.25)}
.mur.g{left:0;border-radius:6px 0 0 0}.mur.d{right:0;border-radius:0 6px 0 0}
.interieur{position:absolute;top:130px;bottom:0;left:30px;right:30px;background-color:#1c1612;background-repeat:repeat-y;background-size:100% auto}
.interieur::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.45) 18%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.45) 82%,rgba(0,0,0,.92))}
.margelle{position:absolute;top:-10px;left:-16px;right:-16px;height:40px;border-radius:10px 10px 4px 4px;background-color:#7a6c5c;background-size:auto 100%;
  box-shadow:inset 0 -8px 10px rgba(0,0,0,.45),0 8px 16px rgba(0,0,0,.55)}
/* portique en bois + poulie */
.portique{position:absolute;top:calc(var(--sol) - 420px);left:50%;width:360px;margin-left:-180px;height:300px;pointer-events:none}
.poteau{position:absolute;bottom:0;width:18px;height:300px;background:linear-gradient(90deg,#4a321e,#6b4a2c,#4a321e);border-radius:4px}
.poteau.g{left:20px}.poteau.d{right:20px}
.poutre{position:absolute;top:0;left:0;right:0;height:22px;background:linear-gradient(#6b4a2c,#4a321e);border-radius:6px}
.poulie{position:absolute;top:10px;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;
  background:radial-gradient(circle,#2b2b2b 0 6px,#8a8a8a 7px 12px,#5a5a5a 13px 18px,#3a3a3a 19px);animation:tourne 2s linear infinite paused}
@keyframes tourne{to{transform:rotate(360deg)}}
.manivelle{position:absolute;bottom:90px;right:-8px;width:40px;height:40px}
.chapeau{position:absolute;top:calc(var(--sol) - 250px);left:calc(50% + 190px);width:clamp(110px,18vw,170px);
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));animation:souffle 4s ease-in-out infinite;z-index:2}
@keyframes souffle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}
.bulle{position:absolute;top:calc(var(--sol) - 330px);left:calc(50% + 175px);background:var(--creme);color:#2a1f16;
  font-style:italic;padding:.5rem .8rem;border-radius:14px;font-size:1rem;max-width:210px;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:2}
.bulle::after{content:"";position:absolute;bottom:-10px;left:28px;border:10px solid transparent;border-top-color:var(--creme);border-bottom:0}
@media(max-width:700px){
  :root{--puitsL:170px}
  .chapeau{left:calc(50% + 105px);top:calc(var(--sol) - 230px)}
  .bulle{left:auto;right:84px;top:calc(var(--sol) - 360px);max-width:150px;font-size:.9rem}
  .portique{width:270px;margin-left:-135px}
}

/* objets cachés dans le puits */
.obj{position:absolute;transform:translate(-50%,-50%);transition:filter .6s,opacity .6s}
.obj svg{display:block;width:100%;height:100%}
.obj .eclat{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,215,120,.45),transparent 65%);opacity:0;transition:opacity .8s}
.obj.vu .eclat{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.goutte{position:absolute;width:5px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:rgba(160,200,230,.8);animation:tombe 2.8s linear infinite}
@keyframes tombe{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(420px);opacity:0}}
.araignee{animation:yoyo 5s ease-in-out infinite}
@keyframes yoyo{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% + 60px))}}
.chauve{transition:transform 1.6s ease-in,opacity 1.6s}
.chauve.vu{transform:translate(160%,-420%) rotate(-20deg) scale(.6);opacity:0}
.chauve svg .aile{transform-origin:50% 60%;animation:bat .25s ease-in-out infinite alternate}
@keyframes bat{to{transform:scaleY(.4)}}
.yeux{animation:cligne 4s infinite}
@keyframes cligne{0%,92%,100%{opacity:1}95%{opacity:0}}
.yeux.vu{opacity:0 !important;transition:opacity .3s}
.racine{position:absolute;width:3px;background:linear-gradient(#5a3e22,#3a2814);border-radius:2px;transform-origin:top}
.eau{position:absolute;bottom:380px;left:50%;width:var(--puitsL);margin-left:calc(var(--puitsL) / -2);height:70px;
  background:linear-gradient(#0d2a33,#061418);overflow:hidden}
.eau::before,.eau::after{content:"";position:absolute;left:-50%;width:200%;height:12px;top:0;border-radius:50%;
  background:rgba(120,190,210,.25);animation:vague 4s ease-in-out infinite}
.eau::after{top:8px;animation-delay:-2s;opacity:.6}
@keyframes vague{0%,100%{transform:translateX(0)}50%{transform:translateX(15%)}}
.brume{position:absolute;bottom:420px;left:50%;width:calc(var(--puitsL) + 120px);margin-left:calc((var(--puitsL) + 120px)/-2);height:140px;
  background:radial-gradient(ellipse,rgba(200,210,220,.18),transparent 70%);animation:brume 7s ease-in-out infinite}
@keyframes brume{0%,100%{transform:translateX(-10px);opacity:.6}50%{transform:translateX(10px);opacity:1}}
.fond{position:absolute;left:0;right:0;bottom:0;height:380px;background:#0a0807}

/* ===== OBSCURITÉ + LAMPE (fixe) ===== */
#nuit{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(ellipse 260px 330px at var(--lx,50%) var(--ly,45%),rgba(0,0,0,0) 0,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.93) 100%)}
#faisceau{position:fixed;pointer-events:none;z-index:3;width:300px;height:380px;opacity:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,236,170,.32),rgba(255,236,170,.08) 55%,transparent 72%);
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);mix-blend-mode:screen}

/* ===== LUMIÈRES DANS LE NOIR (au-dessus de l'obscurité) ===== */
#lumieres{position:fixed;left:0;top:0;width:100%;height:var(--H);z-index:5;pointer-events:none;will-change:transform}
.luciole{position:absolute;width:5px;height:5px;border-radius:50%;background:#9ff5e8;box-shadow:0 0 8px 3px rgba(120,240,220,.7);animation:luit 3s ease-in-out infinite}
@keyframes luit{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.champi{position:absolute;transform:translate(-50%,-100%);animation:champi 4s ease-in-out infinite}
@keyframes champi{0%,100%{filter:drop-shadow(0 0 6px rgba(140,255,200,.6))}50%{filter:drop-shadow(0 0 14px rgba(140,255,200,1))}}
.lyeux{position:absolute;transform:translate(-50%,-50%);animation:cligne 5s infinite}
.etincelle{position:absolute;width:8px;height:8px;transform:translate(-50%,-50%) rotate(45deg);background:#fff6c8;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:etincelle 2.2s ease-in-out infinite}
@keyframes etincelle{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}

/* ===== INDY ===== */
#cable{position:fixed;left:50%;width:2px;margin-left:-1px;background:linear-gradient(#a8a8a8,#6a6a6a);z-index:5;top:0}
#indy{position:fixed;left:50%;width:120px;height:70px;margin-left:-60px;z-index:6;transform-origin:50% 0}
#indy svg{width:100%;height:100%;overflow:visible}
.led{animation:led 1.2s ease-in-out infinite}
@keyframes led{0%,100%{opacity:.75}50%{opacity:1}}
.rec{animation:rec 1s steps(2) infinite}
@keyframes rec{50%{opacity:0}}

/* ===== ÉCRAN CAMÉRA ===== */
#hud{position:fixed;z-index:7;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#e8f2d8;text-shadow:0 0 6px rgba(0,0,0,.9);font-size:14px}
#hud .bloc{background:rgba(0,0,0,.45);border:1px solid rgba(232,242,216,.25);border-radius:8px;padding:6px 10px;line-height:1.5}
#hud .r{color:#ff4d4d}
/* manivelle + corde pour descendre / remonter */
#treuil{position:fixed;z-index:12;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(18,16,14,.72);border:1px solid rgba(201,162,94,.45);border-radius:40px;padding:10px 8px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#treuil button{width:58px;height:58px;border-radius:50%;border:2px solid var(--laiton);background:radial-gradient(circle at 40% 35%,#4a3a26,#1e160e);
  color:var(--laiton-clair);font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#treuil button:active,#treuil button.appui{background:radial-gradient(circle at 40% 35%,#6a5232,#2a1e12);transform:scale(.95)}
#treuil .roue{width:58px;height:58px}
#treuil .roue svg{width:100%;height:100%;transition:transform .05s linear}
#treuil .vite{width:46px !important;height:46px !important;font-family:Arial,sans-serif;font-size:.62rem !important;font-weight:800;line-height:1.05;letter-spacing:.04em;color:#1a120a !important;background:radial-gradient(circle at 40% 35%,#ffb066,#c8501a) !important;border-color:#ffcf9f !important;flex-direction:column}
#treuil .vite.appui,#treuil .vite:active{background:radial-gradient(circle at 40% 35%,#ffc48a,#e0682a) !important}
#treuil .corde{width:4px;height:30px;background:repeating-linear-gradient(170deg,#c8a86a 0 4px,#8a6a3a 4px 8px);border-radius:2px}
#treuil small{font-family:'Cormorant Garamond',serif;font-size:.85rem;color:var(--creme-doux);text-align:center;line-height:1.1}
@media(max-width:700px){
  /* sur téléphone : le treuil passe en bas, à l'horizontale, pour laisser voir les yeux */
  #treuil{flex-direction:row;top:auto;bottom:10px;right:50%;transform:translateX(50%);padding:6px 10px;gap:6px}
  #treuil small,#treuil .corde{display:none}
  #treuil button{width:50px;height:50px}#treuil .vite{width:46px !important;height:46px !important}#treuil .roue{width:44px;height:44px}
  #treuil #descendre{order:4}#treuil #descendreVite{order:5}#treuil .roue{order:3}#treuil #monter{order:2}#treuil #monterVite{order:1}
  #retour{bottom:auto !important;top:70px !important;left:10px;font-size:.95rem;padding:.4rem .8rem}
  #fin{bottom:86px !important}
}
#retour{position:fixed;z-index:8;bottom:14px;left:14px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.05rem;
  color:var(--laiton-clair);background:rgba(18,16,14,.72);border:1px solid rgba(201,162,94,.4);border-radius:40px;padding:.55rem 1rem;text-decoration:none}
#vraie{position:fixed;inset:0;z-index:8;background:#000 center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity 2.5s}
#vraie.on{opacity:1}
#vraie::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.85))}
#grain{position:fixed;inset:0;z-index:9;width:100%;height:100%;image-rendering:pixelated;opacity:0;pointer-events:none}
body.bug #scene,body.bug #lumieres{filter:contrast(1.25) saturate(.5) brightness(.85)}
#grain.on{opacity:1}
#signal{position:fixed;z-index:10;left:50%;top:44%;transform:translate(-50%,-50%);font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:clamp(1.1rem,4vw,1.6rem);color:#e8f2d8;background:rgba(0,0,0,.6);padding:.5rem 1rem;border:1px solid rgba(232,242,216,.5);
  letter-spacing:.15em;opacity:0;pointer-events:none;text-shadow:2px 0 #f33,-2px 0 #3cf}
#signal.on{opacity:1;animation:tremble .12s steps(2) infinite}
@keyframes tremble{50%{transform:translate(calc(-50% + 3px),calc(-50% - 2px))}}
#fin{position:fixed;z-index:11;left:50%;bottom:9vh;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:all .8s;text-align:center;width:min(92vw,520px)}
#fin.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#fin p{font-style:italic;color:var(--creme);font-size:1.15rem;margin-bottom:.8rem;text-shadow:0 2px 10px #000}
#fin a{display:inline-flex;align-items:center;gap:.6rem;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.4rem;
  color:#1a120a;background:linear-gradient(#f0d48f,#c9a25e);padding:.85rem 1.6rem;border-radius:40px;text-decoration:none;
  box-shadow:0 0 30px rgba(230,201,138,.45),0 8px 20px rgba(0,0,0,.6);animation:appel 2s ease-in-out infinite}
@keyframes appel{0%,100%{box-shadow:0 0 22px rgba(230,201,138,.35),0 8px 20px rgba(0,0,0,.6)}50%{box-shadow:0 0 44px rgba(230,201,138,.7),0 8px 20px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="espace" aria-hidden="true"></div>

<div id="scene" aria-label="Coupe d'un puits très profond, Indy la caméra descend au bout de son fil">
  <div class="ciel" id="ciel">
    <div class="lune"></div>
    <div class="colline"></div>
    <div class="corbeau vol" aria-hidden="true"><svg viewBox="0 0 44 26"><g fill="#0a0a0c"><path class="aileC" d="M22 13 Q12 0 0 6 Q10 9 14 16Z"/><path class="aileC" d="M22 13 Q32 0 44 6 Q34 9 30 16Z"/><ellipse cx="22" cy="15" rx="6" ry="4"/></g></svg></div>

    var cv = document.createElement("canvas"); cv.width = largeur; cv.height = hauteur;
    var g = cv.getContext("2d");
    g.fillStyle = sombre ? "#1a1410" : "#2a221b"; g.fillRect(0, 0, largeur, hauteur);    // mortier / terre
    var teintes = sombre

    var y = 0;
    while (y < hauteur){
      var h = alea(16, 42), x = -alea(0, 30);
      while (x < largeur){
        var w = alea(18, 64), t = teintes[Math.floor(Math.random()*teintes.length)], v = alea(-14, 14);
        var c = "rgb(" + (t[0]+v|0) + "," + (t[1]+v|0) + "," + (t[2]+v|0) + ")";
        var j = 4;                                  // forme irrégulière
        g.beginPath();
        g.moveTo(x + alea(1, j+2), y + alea(1, j));
        g.lineTo(x + w*alea(.3,.6), y + alea(0, j));
        g.lineTo(x + w - alea(1, j+2), y + alea(1, j+1));
        g.lineTo(x + w - alea(0, j), y + h*alea(.4,.6));
        g.lineTo(x + w - alea(1, j+2), y + h - alea(1, j));
        g.lineTo(x + w*alea(.4,.7), y + h - alea(0, j));
        g.lineTo(x + alea(1, j+2), y + h - alea(1, j+1));
        g.lineTo(x + alea(0, j), y + h*alea(.4,.6));
        g.closePath();
        g.fillStyle = c; g.fill();
        var gr = g.createLinearGradient(x, y, x, y + h);                  // relief
        gr.addColorStop(0, "rgba(255,240,210,.18)"); gr.addColorStop(.5, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.35)");
        g.fillStyle = gr; g.fill();
        for (var k = 0; k < w*h/40; k++){                                 // grain de la pierre
          g.fillStyle = Math.random() < .5 ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.07)";
          g.fillRect(x + Math.random()*w, y + Math.random()*h, alea(1,2.5), alea(1,2.5));

        if (Math.random() < .12){                                         // fissure

          var fx = x + alea(4, w-4), fy = y + 3; g.moveTo(fx, fy);
          for (var f = 0; f < 4; f++){ fx += alea(-5, 5); fy += h/5; g.lineTo(fx, fy); } g.stroke();

    }

  /* y = profondeur en px depuis le sol ; x = décalage depuis le centre du puits (en px, ou "mur" à gauche/droite) */
  var LISTE = [
    {t:"ver", y:120, x:-200, w:60, h:20}, {t:"ver", y:420, x:210, w:60, h:20},
    {t:"chauve", y:900, x:40, w:90, h:50}, {t:"chauve", y:960, x:-50, w:80, h:44},
    {t:"piece", y:1250, x:-150, w:34, h:34, b:1}, {t:"fossile", y:1500, x:170, w:60, h:60},
    {t:"araignee", y:1900, x:60, w:60, h:60},
    {t:"bouteille", y:2300, x:-160, w:30, h:70, b:1},
    {t:"cle", y:3000, x:150, w:70, h:30, b:1}, {t:"piece", y:3150, x:-170, w:30, h:30, b:1},
    {t:"cruche", y:3550, x:-165, w:50, h:60, b:1},
    {t:"chauve", y:3900, x:-30, w:90, h:50},
    {t:"crane", y:4300, x:165, w:50, h:46, b:1},
    {t:"gemme", y:4700, x:-160, w:46, h:46, b:1}, {t:"gemme", y:4760, x:-190, w:30, h:30, b:1},
    {t:"araignee", y:5100, x:-60, w:56, h:56},
    {t:"casque", y:5500, x:165, w:70, h:45, b:1},
    {t:"piece", y:6100, x:170, w:34, h:34, b:1},
    {t:"epee", y:6500, x:-150, w:120, h:30, b:1},
    {t:"gemme", y:6900, x:175, w:40, h:40, b:1},
    {t:"chauve", y:7200, x:30, w:90, h:50}
  ];
  /* le fond : coffre, squelette, pièces */
  var FOND = H - SOL - 470;      // profondeur du fond (juste au-dessus de l'eau)
  LISTE.push({t:"squelette", y:FOND-10, x:-55, w:120, h:120, b:1});
  LISTE.push({t:"coffre", y:FOND, x:55, w:120, h:86, b:1});
  LISTE.push({t:"piece", y:FOND+40, x:-5, w:26, h:26, b:1});
  LISTE.push({t:"piece", y:FOND+44, x:20, w:22, h:22, b:1});
  LISTE.push({t:"crane", y:FOND+30, x:-100, w:36, h:33, b:1});

  /* si une vraie image existe dans img/puits/ (faite avec GPT), elle remplace le dessin */
  var IMAGES = {araignee:"araignee.png", chauve:"chauve-souris.png", squelette:"squelette.png", coffre:"coffre.png",
    crane:"crane.png", bouteille:"bouteille.png", cle:"cle.png", epee:"epee.png", piece:"piece.png", cruche:"cruche.png",
    gemme:"gemme.png", casque:"casque.png", fossile:"fossile.png", ver:"ver.png"};
  var cache = {};
  function essayerImage(el, t){
    if (!IMAGES[t]) return;
    var src = "img/puits/" + IMAGES[t];
    function poser(){ var svg = el.querySelector("svg"); if (!svg) return;
      var im = document.createElement("img"); im.src = src; im.alt = ""; im.style.cssText = "width:100%;height:100%;object-fit:contain;display:block";
      svg.replaceWith(im); }
    if (cache[src] === true) return poser();
    if (cache[src] === false) return;
    if (cache[src]) return cache[src].push(poser);
    cache[src] = [poser];
    var test = new Image();
    test.onload = function(){ var l = cache[src]; cache[src] = true; l.forEach(function(fn){ fn(); }); };
    test.onerror = function(){ cache[src] = false; };
    test.src = src;
  }
  var objets = [];
  LISTE.forEach(function(o){
    var el = document.createElement("div");
    el.className = "obj " + o.t;
    var w0 = mobile ? o.w*0.8 : o.w;
    var x = o.x;
    if (Math.abs(x) >= 140) x = Math.sign(x) * (demiPuits - w0/2 - 6);   // collé au mur, dans le puits
    else if (mobile) x = Math.round(x * 0.7);
    el.style.left = "calc(50% + " + x + "px)";
    el.style.top = (SOL + o.y) + "px";
    el.style.width = (mobile ? o.w*0.8 : o.w) + "px";
    el.style.height = (mobile ? o.h*0.8 : o.h) + "px";
    el.innerHTML = (o.b ? '<div class="eclat"></div>' : '') + D[o.t];
    // essayerImage(el, o.t);   // désactivé : la descente reste en style rétro
    objetsEl.appendChild(el);
    objets.push({el: el, y: SOL + o.y});
  });

  /* gouttes d'eau qui tombent des murs */
  for (i = 0; i < 16; i++){
    var g = document.createElement("div"); g.className = "goutte";
    g.style.left = "calc(50% + " + ((Math.random() < .5 ? -1 : 1) * (demiPuits - 8)) + "px)";
    g.style.top = (SOL + 300 + Math.random()*(H - SOL - 1300)) + "px";
    g.style.animationDelay = (Math.random()*3) + "s";
    objetsEl.appendChild(g);
  }
  /* racines près du haut */
  for (i = 0; i < 14; i++){
    var r = document.createElement("div"); r.className = "racine";
    var cote = Math.random() < .5 ? -1 : 1;
    r.style.left = "calc(50% + " + (cote * (demiPuits + 30 + Math.random()*140)) + "px)";
    r.style.top = (SOL + 10 + Math.random()*200) + "px";
    r.style.height = (40 + Math.random()*120) + "px";
    r.style.transform = "rotate(" + (cote * (10 + Math.random()*30)) + "deg)";
    objetsEl.appendChild(r);
  }

  var OEIL = '<svg viewBox="0 0 300 300"> <defs> <radialGradient id="rougeID" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2a0000"/><stop offset=".28" stop-color="#3a0000"/><stop offset=".36" stop-color="#ff3a2a"/><stop offset=".5" stop-color="#ff1a0a"/><stop offset=".72" stop-color="#b30000"/><stop offset=".9" stop-color="#4a0000"/><stop offset="1" stop-color="#4a0000" stop-opacity="0"/></radialGradient> <radialGradient id="haloID" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff2010" stop-opacity=".55"/><stop offset=".55" stop-color="#a00000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient> <filter id="flouID"><feGaussianBlur stdDeviation="3"/></filter> </defs> <circle cx="150" cy="150" r="150" fill="url(#haloID)"/> <g > <circle cx="150" cy="150" r="92" fill="url(#rougeID)" filter="url(#flouID)"/> <circle cx="150" cy="150" r="30" fill="#140000"/> <circle cx="150" cy="150" r="12" fill="#ffd8c8" opacity=".85" filter="url(#flouID)"/> <circle cx="122" cy="118" r="9" fill="#fff" opacity=".7" filter="url(#flouID)"/> </g> </svg>';

  /* --- lumières dans le noir --- */
  var lum = document.getElementById("lumieres");
  for (i = 0; i < 70; i++){                       // vers luisants sur les murs
    var l = document.createElement("div"); l.className = "luciole";
    var cote2 = Math.random() < .5 ? -1 : 1;
    l.style.left = "calc(50% + " + (cote2 * (demiPuits - 4 - Math.random()*14)) + "px)";
    l.style.top = (SOL + 700 + Math.random()*(H - SOL - 1600)) + "px";
    l.style.animationDelay = (Math.random()*3) + "s"; l.style.animationDuration = (2 + Math.random()*3) + "s";
    lum.appendChild(l);
  }
  var CHAMPI = '<svg viewBox="0 0 30 30" width="26" height="26"><path d="M3 15 Q15 0 27 15Z" fill="#5fe0a8"/><rect x="12" y="15" width="6" height="12" rx="2" fill="#bff5d8"/><circle cx="10" cy="11" r="2" fill="#e8fff4"/><circle cx="19" cy="9" r="1.6" fill="#e8fff4"/></svg>';
  [[-1,3600],[1,3620],[-1,5300],[1,6700],[-1,FOND+60],[1,FOND+66],[-1,FOND+64]].forEach(function(c){
    var m2 = document.createElement("div"); m2.className = "champi"; m2.innerHTML = CHAMPI;
    m2.style.left = "calc(50% + " + (c[0] * (demiPuits - 18)) + "px)"; m2.style.top = (SOL + c[1]) + "px";
    m2.style.animationDelay = (Math.random()*2) + "s"; lum.appendChild(m2);
  });
  [2650, 4050, 5850, 7400].forEach(function(y, n){       // yeux de rats qui brillent
    var e = document.createElement("div"); e.className = "lyeux";
    e.innerHTML = D.yeux.replace('<svg ', '<svg width="34" height="14" ');
    e.style.left = "calc(50% + " + ((n%2 ? 1 : -1) * (demiPuits + 22)) + "px)"; e.style.top = (SOL + y) + "px";
    e.style.animationDelay = (n*1.3) + "s"; lum.appendChild(e);
  });
  // les deux grands yeux, cachés dans la terre de chaque côté du fond
  var NUM_YEUX = 1 + Math.floor(Math.random() * 5);      // une des 5 paires d'yeux, au hasard à chaque visite
  var TAILLE_OEIL = mobile ? 120 : 300, yeuxTerre = [];
  [-1, 1].forEach(function(cote){
    var o = document.createElement("div"); o.className = "oeilT " + (cote < 0 ? "g" : "d");
    o.style.width = TAILLE_OEIL + "px"; o.style.height = (TAILLE_OEIL * .73) + "px";
    o.style.left = "calc(50% + " + (cote * (demiPuits + (mobile ? 22 : 30) + TAILLE_OEIL * (mobile ? .05 : .5))) + "px)";
    o.style.top = (SOL + FOND - 120) + "px";
    o.innerHTML = '<img src="img/puits/yeux' + NUM_YEUX + '-' + (cote < 0 ? 'g' : 'd') + '.jpg" alt="">';
    lum.appendChild(o); yeuxTerre.push(o);
  });

  for (i = 0; i < 14; i++){                       // étincelles sur le trésor
    var et = document.createElement("div"); et.className = "etincelle";
    et.style.left = "calc(50% + " + (10 + Math.random()*110) + "px)"; et.style.top = (SOL + FOND - 40 + Math.random()*60) + "px";
    et.style.animationDelay = (Math.random()*2.2) + "s"; lum.appendChild(et);
  }

  /* --- la descente --- */
  var INDY_ECRAN = 0.42;     // Indy reste à 42 % de la hauteur de l'écran
  var POULIE_Y = SOL - 400;  // haut du fil (poulie)
  var cible = 0, actuel = 0, vitesse = 0, dernier = 0, panneFaite = false, actuelAvant = 0;
  var maxScroll = function(){ return Math.max(1, H - window.innerHeight); };
  var sens = 0;                         // pixels par image quand on tourne la manivelle
  function borne(v){ return Math.max(0, Math.min(maxScroll(), v)); }
  function tenir(btn, s){
    function go(e){ e.preventDefault(); sens = s; btn.classList.add("appui"); }
    function stop(){ if (sens === s) sens = 0; btn.classList.remove("appui"); }
    btn.addEventListener("pointerdown", go); btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointerleave", stop); btn.addEventListener("pointercancel", stop);
    btn.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); sens = s; } });
    btn.addEventListener("keyup", stop);
  }
  tenir(document.getElementById("descendre"), 2.1);       // petite vitesse
  tenir(document.getElementById("monter"), -2.1);
  tenir(document.getElementById("descendreVite"), 7);     // grande vitesse
  tenir(document.getElementById("monterVite"), -7);
  // la molette et le doigt marchent aussi (sans barre de défilement)
  window.addEventListener("wheel", function(e){ e.preventDefault(); cible = borne(cible + e.deltaY * .6); }, {passive:false});
  var doigt = null;
  window.addEventListener("touchstart", function(e){ if (e.target.closest("#treuil,#fin,#retour")) return; doigt = e.touches[0].clientY; }, {passive:true});
  window.addEventListener("touchmove", function(e){ if (doigt === null) return; var y = e.touches[0].clientY; cible = borne(cible + (doigt - y) * 1.2); doigt = y; }, {passive:true});
  window.addEventListener("touchend", function(){ doigt = null; });
  window.addEventListener("keydown", function(e){
    if (e.key === "ArrowDown" || e.key === "PageDown") cible = borne(cible + 120);
    if (e.key === "ArrowUp" || e.key === "PageUp") cible = borne(cible - 120);
  });
  var roue = document.getElementById("roue"), angleRoue = 0;

  function boucle(t){
    if (sens) cible = borne(cible + sens);
    angleRoue += (actuel - (actuelAvant || 0)) * 1.2; actuelAvant = actuel;
    roue.style.transform = "rotate(" + angleRoue + "deg)";
    // Indy descend lentement : il rattrape le défilement petit à petit
    var avant = actuel;
    actuel += (cible - actuel) * 0.045;
    if (Math.abs(cible - actuel) < 0.3) actuel = cible;
    vitesse = actuel - avant;

    var vh = window.innerHeight;
    var jx = (phase === "grain" && Math.random() < .35) ? (Math.random() * 18 - 9) : 0;   // l'image saute
    scene.style.transform = "translate3d(" + jx + "px," + (-actuel) + "px,0)";
    lum.style.transform = scene.style.transform;

    var indyY = vh * INDY_ECRAN;                 // position d'Indy à l'écran
    var indyMonde = actuel + indyY;               // position d'Indy dans la scène
    // tant qu'on est en haut, Indy pend sous la poulie
    var departMonde = POULIE_Y + 90;
    if (indyMonde < departMonde){ indyY = departMonde - actuel; indyMonde = departMonde; }
    var basMonde = SOL + FOND - 150;              // Indy s'arrête juste au-dessus du trésor
    if (indyMonde > basMonde){ indyY = basMonde - actuel; indyMonde = basMonde; }
    indy.style.top = indyY + "px";
    var balance = Math.max(-14, Math.min(14, -vitesse * 0.9 + Math.sin(t/900) * 2));
    indy.style.transform = "rotate(" + balance + "deg)";

    var hautFil = Math.max(0, POULIE_Y + 33 - actuel);
    cable.style.top = hautFil + "px";
    cable.style.height = Math.max(0, indyY - hautFil) + "px";
    poulie.style.animationPlayState = Math.abs(vitesse) > 0.5 ? "running" : "paused";

    // obscurité : arrive dès qu'Indy passe sous le sol
    var sousSol = indyMonde - SOL;
    var noir = Math.max(0, Math.min(1, (sousSol - 60) / 500));
    nuit.style.opacity = noir;
    nuit.style.setProperty("--ly", (indyY + 40) + "px");
    faisceau.style.opacity = noir;
    faisceau.style.top = (indyY + 58) + "px";
    faisceau.style.left = (window.innerWidth/2 - 150) + "px";

    // profondeur affichée
    var m = Math.max(0, sousSol) / (FOND + 20) * PROF_M;
    profEl.textContent = Math.min(PROF_M, m).toFixed(1).replace(".", ",") + " m";

    // à mi-chemin, la lampe s'éteint deux fois, très court
    if (!panneFaite && sousSol > FOND * 0.5){
      panneFaite = true; var bd = document.body;
      [[0,1],[140,0],[300,1],[520,0]].forEach(function(st){ setTimeout(function(){ bd.classList.toggle("panne", !!st[1]); }, st[0]); });
    }

    // les objets se révèlent quand la lampe passe
    for (var k = 0; k < objets.length; k++){
      var d = Math.abs(objets[k].y - indyMonde);
      if (d < 300 && !objets[k].vu){ objets[k].vu = true; objets[k].el.classList.add("vu"); }
    }

    // au fond : le bouton
    var auFond = cible > maxScroll() - 40 && Math.abs(cible - actuel) < 60;
    finDuPuits(auFond, t);

    requestAnimationFrame(boucle);
  }
  /* --- au fond : l'écran grésille, puis la vraie image apparaît --- */
  var grain = document.getElementById("grain"), signal = document.getElementById("signal"), gctx = grain.getContext("2d");
  var phase = "rien", debutGrain = 0, debutYeux = 0, img = gctx.createImageData(160, 100);
  // image « buggée », hors réseau : bandes noires, micro-coupures, image qui saute (pas de neige blanche)
  function bruit(t){
    gctx.clearRect(0, 0, 160, 100);
    if (Math.random() < .14){ gctx.fillStyle = "#000"; gctx.fillRect(0, 0, 160, 100); return; }   // micro-coupure noire
    var n = 2 + (Math.random() * 5 | 0);
    for (var b = 0; b < n; b++){                                   // bandes noires horizontales
      gctx.fillStyle = "rgba(0,0,0," + (.65 + Math.random() * .35) + ")";
      gctx.fillRect(0, Math.random() * 100, 160, 1 + Math.random() * 10);
    }
    if (Math.random() < .5){                                       // ligne d'interférence discrète
      gctx.fillStyle = "rgba(120,140,130,.18)"; gctx.fillRect(0, Math.random() * 100, 160, 1);
    }
  }
  function finDuPuits(auFond, t){
    if (!auFond){
      if (phase !== "rien"){ phase = "rien"; document.body.classList.remove("bug"); grain.classList.remove("on"); signal.classList.remove("on");
        fin.classList.remove("on"); vraie.classList.remove("on"); }
      return;
    }
    if (phase === "rien"){ phase = "grain"; debutGrain = t; grain.classList.add("on"); signal.textContent = "SIGNAL PERDU…"; signal.classList.add("on"); }
    if (phase === "grain"){
      var e = t - debutGrain;
      bruit(t);
      grain.style.opacity = (e < 1700 ? 1 : Math.max(0, 1 - (e - 1700) / 900));
      document.body.classList.toggle("bug", e < 1900);
      if (e > 1100) signal.textContent = "SIGNAL RETROUVÉ";
      if (e > 1900) signal.classList.remove("on");
      if (e > 2100){                                   // le signal revient… et deux yeux nous regardent depuis la terre
        phase = "fini"; grain.classList.remove("on"); grain.style.opacity = "";
        document.body.classList.remove("bug");
        yeuxTerre.forEach(function(o){ o.classList.add("on"); });
        setTimeout(function(){ if (phase === "fini") fin.classList.add("on"); }, 3200);
      }
    }
  }

  /* la vraie image du fond (img/puits/fond-puits.jpg), si elle existe */
  var vraie = document.getElementById("vraie"), vraieOk = false, tv = new Image();
  tv.onload = function(){ vraie.style.backgroundImage = "url(img/puits/fond-puits.jpg)"; vraieOk = true; };
  tv.src = "img/puits/fond-puits.jpg";

  requestAnimationFrame(boucle);

  // horloge de la caméra
  var debut = Date.now();
  setInterval(function(){
    var s = Math.floor((Date.now() - debut)/1000);
    var hh = String(Math.floor(s/3600)).padStart(2,"0"), mm = String(Math.floor(s/60)%60).padStart(2,"0"), ss = String(s%60).padStart(2,"0");
    heureEl.textContent = hh + ":" + mm + ":" + ss;
  }, 1000);
})();
</script>
</body>
</html>
