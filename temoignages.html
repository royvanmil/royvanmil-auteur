<title>Vos avis — Roy VAN MIL</title>
<meta name="description" content="Laissez votre avis sur les livres de Roy Van Mil et découvrez ce que d'autres lecteurs en ont pensé.">

<style>
  :root{
    /* Palette claire (même que l'index) : noms gardés pour ne rien casser */
    --noir:#f3f7f9;--bois-fonce:#e3edf1;--bois:#d9e4ea;
    --laiton:#2e6e73;--laiton-clair:#1c4f53;
    --creme:#14212e;--creme-doux:#2b3c4d;
    --papier:#fff8e1;--encre:#3a2f22;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'EB Garamond',Georgia,serif;
    background:radial-gradient(ellipse at 15% 0%, rgba(120,170,205,.14) 0%, transparent 45%), radial-gradient(ellipse at 90% 10%, rgba(110,170,160,.10) 0%, transparent 40%), var(--noir);
    color:var(--creme);min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;
    background:none;
    pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:1.5rem 1.2rem 4rem}

  .retour{display:inline-flex;align-items:center;gap:.4rem;color:var(--laiton-clair);
    text-decoration:none;font-family:'Cormorant Garamond',serif;letter-spacing:.08em;
    text-transform:uppercase;font-size:.85rem;margin-bottom:2.5rem;opacity:.85;transition:opacity .2s;}
  .retour:hover{opacity:1}

  .entete{text-align:center;margin-bottom:2.5rem}
  .entete h1{font-family:'Cormorant Garamond',serif;font-weight:700;
    font-size:clamp(2rem,5vw,3rem);line-height:1.1;color:var(--creme);margin-bottom:.7rem;}
  .entete .soustitre{font-style:italic;color:var(--laiton-clair);font-size:1.1rem;line-height:1.6}

  .filet{height:1px;background:linear-gradient(90deg,transparent,var(--laiton),transparent);margin:2.5rem 0}

  /* ---- formulaire ---- */
  .form-carte{
    max-width:620px;margin:0 auto;
    background:#fff;border:1px solid var(--bois);
    border-radius:20px;padding:1.9rem 1.6rem;
    box-shadow:0 20px 44px -24px rgba(25,45,65,.35);
  }
  .form-titre{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.5rem;
    color:var(--laiton-clair);text-align:center;margin-bottom:1.6rem}

  .champ{margin-bottom:1.4rem}
  .champ > label{display:block;font-family:'Cormorant Garamond',serif;font-size:1.05rem;
    letter-spacing:.05em;color:var(--creme);margin-bottom:.6rem}

  .livres-choix{display:flex;flex-direction:column;gap:.5rem}
  .livre-case{display:flex;align-items:center;gap:.65rem;cursor:pointer;
    padding:.6rem .9rem;border:1px solid var(--bois);border-radius:12px;
    background:#f8fbfc;transition:border-color .2s, background .2s;font-size:1.05rem;color:var(--creme-doux)}
  .livre-case:hover{border-color:var(--laiton);color:var(--creme)}
  .livre-case input{accent-color:var(--laiton);width:1.1rem;height:1.1rem;cursor:pointer;flex-shrink:0}
  .livre-case.coche{border-color:var(--laiton);background:rgba(46,110,115,.08);color:var(--creme)}

  input[type=text], textarea{
    width:100%;font-family:'EB Garamond',Georgia,serif;font-size:1.05rem;
    background:#f8fbfc;color:var(--creme);
    border:1px solid var(--bois);border-radius:10px;padding:.7rem .85rem;
    transition:border-color .2s;
  }
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--laiton);background:#fff;box-shadow:0 0 0 3px rgba(46,110,115,.15)}
  textarea{resize:vertical;min-height:110px;line-height:1.6}
  .compte-car{text-align:right;font-size:.85rem;color:var(--creme-doux);margin-top:.3rem}

  /* ---- note en livres ---- */
  .note-livres{display:flex;gap:.35rem;font-size:1.9rem;line-height:1;user-select:none}
  .note-livres span{cursor:pointer;filter:grayscale(1);opacity:.4;transition:filter .15s, opacity .15s, transform .15s}
  .note-livres span:hover{transform:scale(1.15)}
  .note-livres span.actif{filter:none;opacity:1}
  .note-txt{margin-top:.5rem;color:var(--laiton-clair);font-size:1.05rem;font-weight:600;min-height:1.3em}

  .envoyer{
    display:block;width:100%;margin-top:.5rem;padding:.95rem;border:none;border-radius:999px;
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.25rem;letter-spacing:.03em;
    cursor:pointer;color:#2b1d10;
    background:linear-gradient(180deg,#f2b544 0%, #dfa02a 100%);
    border:1px solid #f0c86f;
    box-shadow:0 10px 26px rgba(242,181,68,.22), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .2s, box-shadow .2s, opacity .2s;
  }
  .envoyer:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(242,181,68,.3), inset 0 1px 0 rgba(255,255,255,.32)}
  .envoyer:disabled{opacity:.5;cursor:default;transform:none}

  .form-msg{text-align:center;margin-top:1rem;font-size:1.05rem;min-height:1.4em}
  .form-msg.ok{color:var(--laiton-clair)}
  .form-msg.err{color:#b3261e}

  /* ---- mur d'avis ---- */
  .mur-titre{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.8rem;
    color:var(--laiton-clair);text-align:center;margin-bottom:.4rem}
  .mur-moyenne{text-align:center;color:var(--creme-doux);font-style:italic;margin-bottom:2rem}

  .mur{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.3rem}
  .postit{
    background:var(--papier);color:#2a2018;border-radius:3px;
    padding:1.1rem 1.15rem 1.2rem;position:relative;
    box-shadow:0 14px 28px -12px rgba(25,45,65,.35);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .postit:nth-child(3n){transform:rotate(-1.4deg)}
  .postit:nth-child(3n+1){transform:rotate(1deg)}
  .postit:nth-child(3n+2){transform:rotate(-.5deg)}
  .postit::before{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:58px;height:18px;background:rgba(201,162,94,.55);
    border:1px solid rgba(120,90,40,.4);border-radius:2px;
    box-shadow:0 2px 4px rgba(0,0,0,.25);
  }
  .postit-note{font-size:1.05rem;line-height:1;margin-bottom:.6rem;color:#b8860b;font-weight:700;letter-spacing:.08em}
  .postit-avis{font-size:1.05rem;line-height:1.55;margin-bottom:.8rem;white-space:pre-wrap;word-break:break-word;color:#1a130c;font-weight:500}
  .postit-nom{font-weight:700;font-size:1.05rem;color:#5a4029}
  .postit-livres{font-size:.82rem;color:#8a7355;margin-top:.15rem}

  .mur-vide{text-align:center;color:var(--creme-doux);font-style:italic;padding:2rem 0}

  @media (max-width:600px){
    .form-carte{padding:1.4rem 1.1rem}
    .mur{grid-template-columns:1fr}
  }

  /* ---- sélecteur de langue (FR / EN / NL) ---- */
  .langues{position:absolute;top:1rem;right:1rem;z-index:50;display:flex;gap:.35rem;
    font-family:'Cormorant Garamond',Georgia,serif;}
  .langues button{background:#fff;color:#2b3c4d;border:1px solid #cfdbe2;border-radius:999px;
    padding:.32rem .62rem;font-family:inherit;font-size:.92rem;font-weight:600;
    letter-spacing:.08em;cursor:pointer;transition:all .2s;}
  .langues button:hover{color:#1c4f53;border-color:#2e6e73}
  .langues button.actif{background:#2e6e73;color:#fff;border-color:#2e6e73}
  .mention-fr{display:none;max-width:560px;margin:1rem auto 1.6rem;padding:.6rem .9rem;
    border:1px solid #d9e4ea;border-radius:10px;background:#fff;text-align:center;
    font-family:'EB Garamond',Georgia,serif;font-style:italic;color:#1c4f53;font-size:1rem;line-height:1.5;}
  @media (max-width:480px){
    .langues{top:.7rem;right:.7rem}
    .langues button{padding:.28rem .5rem;font-size:.82rem}
  }
</style>
</head>
<body>
  <div class="langues" role="group" aria-label="Langue / Language / Taal">
    <button type="button" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" data-lang="nl" onclick="setLang('nl')">NL</button>
  </div>

  <div class="wrap">
    <a class="retour" href="index.html" data-i18n="retour">← Retour à la bibliothèque</a>

    <div class="entete">
      <h1 data-i18n="h1">Votre avis compte</h1>
      <p class="soustitre" data-i18n="soustitre">Vous avez lu l'un de mes livres ?<br>Dites-moi ce que vous en avez pensé.</p>
    </div>

    <!-- ===== Mur d'avis ===== -->
    <div class="mur-titre" data-i18n="mur_titre">Ce qu'en disent les lecteurs</div>
    <div class="mention-fr" data-i18n="mention"></div>
    <div class="mur-moyenne" id="mur-moyenne"></div>
    <div class="mur" id="mur"></div>

    <div class="filet"></div>

    <!-- ===== Formulaire ===== -->
    <div class="form-carte">
      <div class="form-titre" data-i18n="form_titre">Laisser un avis</div>

      <div class="champ">
        <label data-i18n="lab_livres">Quel(s) livre(s) souhaitez-vous noter ?</label>
        <div class="livres-choix" id="livres-choix"></div>
      </div>

      <div class="champ">
        <label for="nom" data-i18n="lab_nom">Votre nom (ou prénom)</label>
        <input type="text" id="nom" maxlength="60" placeholder="Ex. Marie, ou Jean D." data-i18n-ph="ph_nom">
      </div>

      <div class="champ">
        <label for="avis" data-i18n="lab_avis">Votre avis</label>
        <textarea id="avis" maxlength="1500" placeholder="Ce que vous avez ressenti, aimé, retenu…" data-i18n-ph="ph_avis"></textarea>
        <div class="compte-car"><span id="car">0</span> / 1500</div>
      </div>

      <div class="champ">
        <label data-i18n="lab_note">Votre note</label>
        <div class="note-livres" id="note-livres">
          <span data-n="1">📖</span><span data-n="2">📖</span><span data-n="3">📖</span><span data-n="4">📖</span><span data-n="5">📖</span>
        </div>
        <div class="note-txt" id="note-txt"></div>
      </div>

      <button class="envoyer" id="btn-envoyer" onclick="envoyer()" data-i18n="btn">Envoyer mon avis</button>
      <div class="form-msg" id="form-msg"></div>
    </div>
  </div>

<script>
  var API = "https://compteurs.royvanmil86.workers.dev";

  var LIVRES = {
    "cette-maison": "Cette maison, elle vaut vraiment le prix ?",
    "un-instant": "Un instant, ou Deux…",
    "la-cloche": "La Cloche des Morts",
    "un-instant-trois": "Un instant, ou Trois…"
  };
  
  var noteChoisie = 0;

  // --- construire les cases livres ---
  (function(){
    var zone = document.getElementById('livres-choix');
    Object.keys(LIVRES).forEach(function(cle){
      var lab = document.createElement('label');
      lab.className = 'livre-case';
      lab.innerHTML = '<input type="checkbox" value="'+cle+'"> <span>'+LIVRES[cle]+'</span>';
      var cb = lab.querySelector('input');
      cb.addEventListener('change', function(){ lab.classList.toggle('coche', cb.checked); });
      zone.appendChild(lab);
    });
  })();

  // --- compteur de caractères ---
  document.getElementById('avis').addEventListener('input', function(){
    document.getElementById('car').textContent = this.value.length;
  });

  // --- note en livres ---
  (function(){
    var etoiles = document.querySelectorAll('#note-livres span');
    function peindre(n){
      etoiles.forEach(function(s){
        s.classList.toggle('actif', parseInt(s.getAttribute('data-n'),10) <= n);
      });
    }
    etoiles.forEach(function(s){
      var n = parseInt(s.getAttribute('data-n'),10);
      s.addEventListener('mouseenter', function(){ peindre(n); });
      s.addEventListener('click', function(){
        noteChoisie = n;
        peindre(n);
        document.getElementById('note-txt').textContent = T('note'+n);
      });
    });
    document.getElementById('note-livres').addEventListener('mouseleave', function(){ peindre(noteChoisie); });
  })();

  // --- envoi ---
  function envoyer(){
    var msg = document.getElementById('form-msg');
    msg.className = 'form-msg';
    msg.textContent = '';

    var livres = [];
    document.querySelectorAll('#livres-choix input:checked').forEach(function(c){ livres.push(c.value); });
    var nom = document.getElementById('nom').value.trim();
    var avis = document.getElementById('avis').value.trim();

    if(livres.length === 0){ msg.className='form-msg err'; msg.textContent=T('err_livre'); return; }
    if(nom.length < 2){ msg.className='form-msg err'; msg.textContent=T('err_nom'); return; }
    if(avis.length < 3){ msg.className='form-msg err'; msg.textContent=T('err_avis'); return; }
    if(noteChoisie < 1){ msg.className='form-msg err'; msg.textContent=T('err_note'); return; }

    var btn = document.getElementById('btn-envoyer');
    btn.disabled = true;
    btn.textContent = T('envoi');

    fetch(API + "/avis", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({livres:livres, nom:nom, avis:avis, note:noteChoisie})
    })
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(res){
      if(res.j.ok){
        msg.className='form-msg ok';
        msg.textContent=T('merci');
        // vider le formulaire
        document.querySelectorAll('#livres-choix input:checked').forEach(function(c){ c.checked=false; c.closest('.livre-case').classList.remove('coche'); });
        document.getElementById('nom').value='';
        document.getElementById('avis').value='';
        document.getElementById('car').textContent='0';
        noteChoisie=0;
        document.querySelectorAll('#note-livres span').forEach(function(s){ s.classList.remove('actif'); });
        document.getElementById('note-txt').textContent='';
        btn.textContent=T('envoye');
        setTimeout(function(){ btn.disabled=false; btn.textContent=T('btn'); }, 3000);
      } else {
        if(res.status === 429 || (res.j && res.j.erreur === "trop_rapide")){
          msg.className='form-msg err';
          msg.textContent=T('err_vite');
        } else {
          msg.className='form-msg err';
          msg.textContent=T('err_envoi');
        }
        btn.disabled=false; btn.textContent=T('btn');
      }
    })
    .catch(function(){
      msg.className='form-msg err';
      msg.textContent=T('err_reseau');
      btn.disabled=false; btn.textContent=T('btn');
    });
  }

  // --- charger le mur d'avis publiés ---
  function livresEnTexte(cles){
    return (cles||[]).map(function(c){ return LIVRES[c] || c; }).join(" · ");
  }
  function livresEmoji(n){
    return "📖".repeat(n) + "  " + n + "/5";
  }
  function chargerMur(){
    fetch(API + "/avis-publics")
      .then(function(r){ return r.json(); })
      .then(function(avis){
        MUR_DATA = avis || [];
        var mur = document.getElementById('mur');
        var moy = document.getElementById('mur-moyenne');
        if(!avis || avis.length === 0){
          mur.innerHTML = '<div class="mur-vide" data-i18n="mur_vide">' + T('mur_vide') + '</div>';
          moy.textContent = '';
          return;
        }
        var somme = avis.reduce(function(a,b){ return a + (b.note||0); }, 0);
        var moyenne = (somme / avis.length).toFixed(1);
        moy.textContent = moyenne + " / 5 — " + avis.length + " " + T('mot_avis');

        mur.innerHTML = "";
        avis.forEach(function(e){
          var c = document.createElement('div');
          c.className = 'postit';
          c.innerHTML =
            '<div class="postit-note">' + livresEmoji(e.note) + '</div>' +
            '<div class="postit-avis"></div>' +
            '<div class="postit-nom"></div>' +
            '<div class="postit-livres"></div>';
          c.querySelector('.postit-avis').textContent = e.avis;
          c.querySelector('.postit-nom').textContent = e.nom;
          c.querySelector('.postit-livres').textContent = livresEnTexte(e.livres);
          mur.appendChild(c);
        });
      })
      .catch(function(){
        document.getElementById('mur').innerHTML = '<div class="mur-vide" data-i18n="mur_erreur">' + T('mur_erreur') + '</div>';
      });
  }
  var MUR_DATA = null;
  chargerMur();

  // --- compteur de visites de la page ---
  (function(){
    var url = API + "/compte?c=temoignages";
    try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch(e){}
    try { fetch(url, {mode:"cors", keepalive:true}); } catch(e){}
  })();
</script>

  "mur_vide": "Nog geen recensies gepubliceerd. Wees de eerste!",
  "mur_erreur": "De recensies kunnen nu niet worden geladen.",
  "mot_avis": "recensies"
 }
};

  // réafficher les textes calculés quand on change de langue
  function apresLangue(){
    if(MUR_DATA && MUR_DATA.length){
      var somme = MUR_DATA.reduce(function(a,b){ return a + (b.note||0); }, 0);
      document.getElementById('mur-moyenne').textContent =
        (somme / MUR_DATA.length).toFixed(1) + " / 5 — " + MUR_DATA.length + " " + T('mot_avis');
    }
    if(noteChoisie > 0) document.getElementById('note-txt').textContent = T('note'+noteChoisie);
  }

  // ===== Langue (FR / EN / NL) =====
  var LANG = 'fr';
  function T(k){
    var d = I18N[LANG] || I18N.fr;
    return (d[k] !== undefined) ? d[k] : I18N.fr[k];
  }
  function setLang(lang){
    if(!I18N[lang]) lang = 'fr';
    LANG = lang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = T(el.getAttribute('data-i18n')); if(v !== undefined) el.innerHTML = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var v = T(el.getAttribute('data-i18n-ph')); if(v !== undefined) el.placeholder = v;
    });
    document.querySelectorAll('[data-i18n-alt]').forEach(function(el){
      var v = T(el.getAttribute('data-i18n-alt')); if(v !== undefined) el.alt = v;
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){
      var v = T(el.getAttribute('data-i18n-aria')); if(v !== undefined) el.setAttribute('aria-label', v);
    });
    if(T('titre_page')) document.title = T('titre_page');
    document.documentElement.lang = lang;
    document.querySelectorAll('.langues button').forEach(function(b){
      b.classList.toggle('actif', b.getAttribute('data-lang') === lang);
    });
    document.querySelectorAll('.mention-fr').forEach(function(m){
      m.style.display = (lang === 'fr') ? 'none' : 'block';
    });
    try{ localStorage.setItem('rvm-lang', lang); localStorage.setItem('royvanmil-lang', lang); }catch(e){}
    if(typeof apresLangue === 'function') apresLangue();
  }
  (function(){
    var saved = 'fr';
    try{
      saved = localStorage.getItem('royvanmil-lang') || localStorage.getItem('rvm-lang');
      if(!saved){
        var l = (navigator.language || 'fr').toLowerCase();
        saved = l.indexOf('nl') === 0 ? 'nl' : (l.indexOf('en') === 0 ? 'en' : 'fr');
      }
    }catch(e){ saved = 'fr'; }
    setLang(saved);
  })();
</script>
</body>
</html>
