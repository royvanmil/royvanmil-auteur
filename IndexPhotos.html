<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roy Van Mil — Photographe</title>
<meta name="description" content="Roy Van Mil, photographe : portraits, mariages et regards divers.">
<meta name="robots" content="noindex">
<style>
:root{
  --paper:#f4f1eb;
  --ink:#101820;
  --muted:#857e74;
  --burgundy:#7b1f31;
  --line:#c9c1b6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;display:grid;grid-template-columns:minmax(330px,43%) 1fr;position:relative;overflow:hidden}
.page:before{content:"";position:absolute;left:43%;top:8vh;bottom:8vh;width:1px;background:rgba(123,31,49,.38)}
.left{padding:9vh 7vw 6vh;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:14px;letter-spacing:.42em;font-weight:700;color:var(--burgundy);margin-bottom:16px}
h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(56px,6.5vw,104px);line-height:.88;margin:0 0 30px;font-weight:600;letter-spacing:-.045em}
.intro{max-width:520px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#4d4944;margin:0 0 36px}
.menu{display:grid;gap:12px;max-width:440px}
.menu a{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--ink);padding:15px 4px 13px;font-family:Georgia,'Times New Roman',serif;font-size:22px;transition:.25s ease}
.menu a:after{content:"\2197";font-family:Arial,sans-serif;font-size:16px;color:var(--burgundy);opacity:.7}
.menu a:hover{padding-left:12px;color:var(--burgundy)}
.back{margin-top:48px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--burgundy)}
.back:hover{text-decoration:underline}
.right{position:relative;min-height:100vh;padding:8vh 6vw}
.frame{position:absolute;background:#d8d3cb;overflow:hidden;background-size:cover;background-position:center}
.frame:after{content:attr(data-label);position:absolute;inset:auto 18px 18px auto;font-size:10px;letter-spacing:.22em;color:rgba(16,24,32,.55);text-transform:uppercase}
.f1{width:min(38vw,580px);height:min(60vh,680px);right:15vw;top:8vh;border-radius:2px;background-image:linear-gradient(150deg,#cac4bb,#e2ddd4)}
.f2{width:min(29vw,450px);height:min(47vh,530px);right:4.5vw;bottom:7vh;border-radius:2px;background-image:linear-gradient(145deg,#dedad3,#c5bfb6)}
.f3{width:min(13vw,190px);height:min(20vh,220px);left:6vw;bottom:10vh;border-radius:2px;background-image:linear-gradient(145deg,#c9c4bc,#e0dcd5)}
.redline{position:absolute;width:150px;height:3px;background:var(--burgundy);right:6vw;top:14vh}
.caption{position:absolute;right:6vw;top:15.5vh;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
@media (max-width:900px){
  .page{grid-template-columns:1fr}
  .page:before{display:none}
  .left{padding:7vh 8vw 4vh}
  .right{min-height:82vh;padding:4vh 8vw 8vh}
  .f1{left:8vw;right:auto;top:2vh;width:60vw;height:38vh}
  .f2{right:8vw;bottom:9vh;width:52vw;height:34vh}
  .f3{left:60vw;bottom:2vh;width:26vw;height:15vh}
  .redline{display:none}
  .caption{display:none}
}
</style>
</head>
<body>
<main class="page">
  <section class="left">
    <div class="kicker">ROY VAN MIL</div>
    <h1>Photographe</h1>
    <p class="intro">Des portraits, des instants et des regards. Une photographie simple, humaine, sans mise en sc&egrave;ne inutile.</p>
    <nav class="menu" aria-label="Galeries">
      <a href="Photos1Portrait.html">L&rsquo;Art du Portrait</a>
      <a href="Photos2Mariage.html">Le Jour J</a>
      <a href="Photos3Divers.html">Regards divers</a>
    </nav>
    <a class="back" href="index.html">&larr; Site web auteur &middot; livres</a>
  </section>
  <section class="right" aria-label="Aper&ccedil;u photographique">
    <div class="redline"></div><div class="caption">S&eacute;lection &middot; 2026</div>
    <div class="frame f1" data-label="Portrait 01"></div>
    <div class="frame f2" data-label="Instant 02"></div>
    <div class="frame f3" data-label="D&eacute;tail 03"></div>
  </section>
</main>
</body>
</html>
