/* Scène */
.scene{position:relative;height:min(68vh,620px);min-height:380px;overflow:hidden}
.scene svg.dessin{width:100%;height:100%;display:block}
.flamme{transform-origin:600px 520px;animation:feu .7s ease-in-out infinite alternate}
.flamme2{transform-origin:600px 520px;animation:feu .5s ease-in-out infinite alternate-reverse}
@keyframes feu{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(1.06,.9) skewX(4deg)}}
.braise{animation:monte 3s linear infinite}
@keyframes monte{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-160px);opacity:0}}
.halo{animation:halo 1.4s ease-in-out infinite alternate}
@keyframes halo{0%{opacity:.45}100%{opacity:.7}}
.feuille{transform-box:fill-box;transform-origin:bottom center;animation:vent 6s ease-in-out infinite alternate}
@keyframes vent{0%{transform:rotate(-2deg)}100%{transform:rotate(3deg)}}
.fl{transform-box:fill-box;transform-origin:bottom center;animation:vent 4s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.flamme,.flamme2,.braise,.halo,.feuille,.fl{animation:none}}

.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;font-weight:800}

.note{text-align:center;color:#bfe0c3;font-size:.9rem;padding:26px 0 120px}

@media(max-width:600px){

<script>
/* fleurs partout, au hasard (mais pas sur le feu ni la boue) */
(function(){
  const g=document.getElementById("fleurs"),ns="http://www.w3.org/2000/svg";
  const coul=["#f4a7b9","#ffffff","#c9b3f0","#ff9bb5","#9fd3f0","#ffd56b","#ff7a7a","#ffbf8f"];
  const pos=[];let essais=0;
  while(pos.length<70&&essais<600){
    essais++;
    const x=Math.random()*1180,y=400+Math.random()*200;
    if(Math.abs(x-710)<115&&y>385) continue;
    if(x>320&&x<600&&y>395&&y<500) continue;
    pos.push([x,y]);
  }
  pos.sort((a,b)=>a[1]-b[1]).forEach(([x,y],n)=>{
    const t=18+((y-400)/200)*30+Math.random()*10;
    const u=document.createElementNS(ns,"use");
    u.setAttribute("href","#fleur");u.setAttribute("x",x);u.setAttribute("y",y-t*1.5);
    u.setAttribute("width",t);u.setAttribute("height",t*1.5);
    u.setAttribute("color",coul[n%coul.length]);
    u.setAttribute("class","fl");u.style.animationDelay=(Math.random()*4).toFixed(2)+"s";
    g.appendChild(u);
  });
})();

const translations={
  fr:{all:"Toutes les histoires",fr:"Histoire en français.",others:"Les autres histoires",contact:"Contactez-moi",
      loading:"Chargement…",soonAudio:"L'audio arrive bientôt…",part:"Partie"},
  en:{all:"All the stories",fr:"Story in French.",others:"The other stories",contact:"Contact me",
      loading:"Loading…",soonAudio:"The audio is coming soon…",part:"Part"},
  nl:{all:"Alle verhalen",fr:"Verhaal in het Frans.",others:"De andere verhalen",contact:"Neem contact op",
      loading:"Laden…",soonAudio:"De audio komt binnenkort…",part:"Deel"}
};
let T=translations.fr,PISTES=null,dejaEcoute=0;

function dessinePistes(){
  const box=document.getElementById("pistes");
  if(PISTES===null){box.innerHTML='<div class="attente">'+T.loading+'</div>';return;}
  if(!PISTES.length){box.innerHTML='<div class="attente">'+T.soonAudio+'</div>';return;}
  box.innerHTML="";
  PISTES.forEach((f,i)=>{
    const d=document.createElement("div");d.className="piste";
    if(PISTES.length>1){const t=document.createElement("div");t.className="piste-titre";t.textContent=T.part+" "+(i+1);d.appendChild(t);}
    const a=document.createElement("audio");a.controls=true;a.preload="metadata";a.src=f;
    a.setAttribute("aria-label",TITRE+(PISTES.length>1?" — "+T.part+" "+(i+1):""));
    d.appendChild(a);box.appendChild(d);
  });
  const tous=[...box.querySelectorAll("audio")];
  tous.forEach(a=>a.addEventListener("play",()=>{if(!dejaEcoute){dejaEcoute=1;compte("audio4-ecoute");}}));
  tous.forEach((a,i)=>{
    a.addEventListener("play",()=>tous.forEach(x=>{if(x!==a)x.pause()}));
    a.addEventListener("ended",()=>{if(tous[i+1])tous[i+1].play()});
  });
}

function chargePistes(){
  fetch("https://api.github.com/repos/royvanmil/royvanmil-auteur/contents/"+DOSSIER_AUDIO+"?ref=main")
    .then(r=>r.ok?r.json():Promise.reject())
    .then(liste=>{
      PISTES=(Array.isArray(liste)?liste:[])
        .filter(f=>f.type==="file"&&/\.mp3$/i.test(f.name)&&parseInt(f.name,10)===NUMERO)
        .sort((a,b)=>a.name.localeCompare(b.name,"fr",{numeric:true}))
        .map(f=>"/"+f.path.split("/").map(encodeURIComponent).join("/"));
      if(!PISTES.length)PISTES=SECOURS.map(p=>p.split("/").map(encodeURIComponent).join("/"));
      dessinePistes();
    })
    .catch(()=>{PISTES=SECOURS.map(p=>p.split("/").map(encodeURIComponent).join("/"));dessinePistes();});
}

function setLanguage(lang){
  T=translations[lang]||translations.fr;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(T[k]!==undefined)el.textContent=T[k];});
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  try{localStorage.setItem("royvanmil-lang",lang)}catch(e){}
  dessinePistes();
}
document.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));

var API="https://compteurs.royvanmil86.workers.dev";
function compte(cle){var url=API+"/compte?c="+cle;try{if(navigator.sendBeacon&&navigator.sendBeacon(url))return;}catch(e){}try{fetch(url,{mode:"cors",keepalive:true});}catch(e){}}

let initial="fr";
try{
  const s=localStorage.getItem("royvanmil-lang");
  if(s&&translations[s])initial=s;
  else{const l=(navigator.language||"fr").toLowerCase();if(l.startsWith("nl"))initial="nl";else if(l.startsWith("en"))initial="en";}
}catch(e){}
setLanguage(initial);
chargePistes();
compte("audio4h9");
</script>
