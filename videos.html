<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidéos — Roy Van Mil</title>
<meta name="description" content="Les vidéos de Roy Van Mil, auteur : Papi raconte les livres.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --fond:#f3f6f8;
    --carte:#ffffff;
    --encre:#1b2530;
    --doux:#5b6875;
    --ligne:#dfe6eb;
    --laiton:#b08a45;
    --rouge:#b3202a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--fond);
    color:var(--encre);
    font-family:'EB Garamond',Georgia,serif;
    font-size:18px;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:inherit}

  /* Haut de page */
  header{
    max-width:1100px;margin:0 auto;
    padding:22px 16px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .logo img{height:54px;width:auto;display:block}
  .langues{display:flex;gap:6px}
  .langues button{
    font-family:inherit;font-size:15px;
    background:transparent;border:1px solid var(--ligne);
    color:var(--doux);padding:4px 10px;border-radius:20px;cursor:pointer;
  }
  .langues button.actif{background:var(--encre);color:#fff;border-color:var(--encre)}

  .intro{max-width:1100px;margin:0 auto;padding:34px 16px 10px;text-align:center}
  .intro h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(38px,6vw,58px);line-height:1.1;letter-spacing:.5px;
  }
  .intro p{color:var(--doux);margin-top:8px;font-size:19px}
  .filet{width:60px;height:2px;background:var(--laiton);margin:18px auto 0}

  /* Grille des vidéos */
  .grille{
    max-width:1100px;margin:0 auto;padding:30px 16px 50px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px;
  }
  .video{
    background:var(--carte);border:1px solid var(--ligne);border-radius:14px;
    overflow:hidden;box-shadow:0 6px 20px rgba(27,37,48,.06);
  }
  .video video{
    display:block;width:100%;aspect-ratio:9/16;background:#0d1218;object-fit:contain;
  }
  .video h2{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:24px;padding:12px 16px 14px;text-align:center;
  }
  .message{grid-column:1/-1;text-align:center;color:var(--doux);padding:40px 0}

  footer{text-align:center;padding:0 16px 40px}
  footer a{
    display:inline-block;text-decoration:none;
    border:1px solid var(--encre);border-radius:30px;padding:8px 22px;font-size:17px;
  }
  footer a:hover{background:var(--encre);color:#fff}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html"><img src="img/roy-van-mil.png" alt="Roy Van Mil"></a>
  <div class="langues">
    <button data-l="fr">FR</button>
    <button data-l="en">EN</button>
    <button data-l="nl">NL</button>
  </div>
</header>

<section class="intro">
  <h1 data-t="titre">Vidéos</h1>
  <p data-t="soustitre">Papi vous raconte mes livres.</p>
  <div class="filet"></div>
</section>

<main class="grille" id="grille">
  <p class="message" data-t="chargement">Chargement…</p>
</main>

<footer>
  <a href="index.html" data-t="retour">← Retour à l'accueil</a>
</footer>

<script>
/* ===== Réglages ===== */
const DEPOT   = "royvanmil/royvanmil-auteur";
const BRANCHE = "main";
const DOSSIER = "videos";

/* Ordre d'affichage : les vidéos dont le nom contient ces mots passent d'abord, dans cet ordre.
   Les nouvelles vidéos (autres noms) arrivent après, par ordre alphabétique. */
const ORDRE = ["Deux","Trois","Quatre","Cloche","maison"];

/* ===== Textes FR / EN / NL ===== */
const TXT = {
  fr:{titre:"Vidéos",soustitre:"Papi vous raconte mes livres.",chargement:"Chargement…",
      vide:"Aucune vidéo pour le moment.",erreur:"Les vidéos n'ont pas pu être chargées. Réessayez plus tard.",
      retour:"← Retour à l'accueil",francais:"Vidéo en français"},
  en:{titre:"Videos",soustitre:"Grandpa tells you about my books.",chargement:"Loading…",
      vide:"No videos yet.",erreur:"The videos could not be loaded. Please try again later.",
      retour:"← Back to home",francais:"Video in French"},
  nl:{titre:"Video's",soustitre:"Opa vertelt over mijn boeken.",chargement:"Laden…",
      vide:"Nog geen video's.",erreur:"De video's konden niet worden geladen. Probeer het later opnieuw.",
      retour:"← Terug naar home",francais:"Video in het Frans"}
};

let langue = "fr";
try{ langue = localStorage.getItem("langue") || ""; }catch(e){}
if(!TXT[langue]){
  const nav = (navigator.language||"fr").slice(0,2).toLowerCase();
  langue = TXT[nav] ? nav : "fr";
}

function appliquerLangue(){
  document.documentElement.lang = langue;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.dataset.t; if(TXT[langue][k]) el.textContent = TXT[langue][k];
  });
  document.querySelectorAll(".langues button").forEach(b=>{
    b.classList.toggle("actif", b.dataset.l===langue);
  });
  document.querySelectorAll(".video video").forEach(v=>{
    v.title = TXT[langue].francais;
  });
}
document.querySelectorAll(".langues button").forEach(b=>{
  b.addEventListener("click",()=>{
    langue = b.dataset.l;
    try{ localStorage.setItem("langue",langue); }catch(e){}
    appliquerLangue();
  });
});

/* Titre lisible à partir du nom du fichier
   ex. Papi_Un_instant_ou_Deux_Facebook.mp4 → « Un instant, ou Deux… » */
function titreDepuisNom(nom){
  let t = nom.replace(/\.[^.]+$/,"")
             .replace(/^Papi[_\- ]*/i,"")
             .replace(/[_\- ]*Facebook$/i,"")
             .replace(/[_\-]+/g," ").trim();
  const m = t.match(/^Un instant ou (\w+)$/i);
  if(m) return "Un instant, ou " + m[1].charAt(0).toUpperCase() + m[1].slice(1) + "…";
  return t;
}

function rang(nom){
  for(let i=0;i<ORDRE.length;i++){ if(nom.toLowerCase().includes(ORDRE[i].toLowerCase())) return i; }
  return ORDRE.length;
}

function afficher(fichiers){
  const grille = document.getElementById("grille");
  grille.innerHTML = "";
  if(!fichiers.length){
    grille.innerHTML = '<p class="message" data-t="vide"></p>'; appliquerLangue(); return;
  }
  fichiers.sort((a,b)=> rang(a)-rang(b) || a.localeCompare(b));
  fichiers.forEach(nom=>{
    const carte = document.createElement("article");
    carte.className = "video";
    const v = document.createElement("video");
    v.src = DOSSIER + "/" + encodeURIComponent(nom);
    v.controls = true;
    v.preload = "metadata";
    v.playsInline = true;
    const h = document.createElement("h2");
    h.textContent = titreDepuisNom(nom);
    carte.append(v,h);
    grille.append(carte);
  });
  /* Une seule vidéo joue à la fois */
  const toutes = grille.querySelectorAll("video");
  toutes.forEach(v=> v.addEventListener("play",()=>{
    toutes.forEach(a=>{ if(a!==v) a.pause(); });
  }));
  appliquerLangue();
}

/* Chargement automatique : toutes les vidéos du dossier videos/ sur GitHub */
fetch("https://api.github.com/repos/"+DEPOT+"/contents/"+DOSSIER+"?ref="+BRANCHE)
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(liste=>{
    const vids = liste.filter(f=> f.type==="file" && /\.(mp4|webm|mov)$/i.test(f.name)).map(f=>f.name);
    afficher(vids);
  })
  .catch(()=>{
    document.getElementById("grille").innerHTML = '<p class="message" data-t="erreur"></p>';
    appliquerLangue();
  });

appliquerLangue();
</script>

<script src="avis-bouton.js"></script>
</body>
</html>
