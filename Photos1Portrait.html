<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portrait — Roy Van Mil</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#f4f1eb;--ink:#101820;--muted:#857e74;--burgundy:#7b1f31}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.entete{text-align:center;padding:6vh 8vw 1vh}
.calli{display:block;margin:0 auto;width:min(72vw,470px);height:auto}
.accroche{max-width:620px;margin:1vh auto 0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(16px,2vw,20px);line-height:1.6;color:#4d4944;font-style:italic}
.trait{width:90px;height:3px;background:var(--burgundy);margin:2.5vh auto 0}

.viewer{max-width:1100px;margin:3vh auto 0;padding:0 4vw;display:flex;flex-direction:column;align-items:center}
.scene{position:relative;width:100%;height:64vh;min-height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scene img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:2px;box-shadow:0 10px 40px rgba(16,24,32,.18)}
.fleche{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(244,241,235,.85);border:1.5px solid var(--ink);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;z-index:2}
.fleche:hover{background:var(--ink);color:var(--paper)}
.prev{left:0}
.next{right:0}
.compteur{margin-top:2.2vh;font-size:13px;letter-spacing:.18em;color:var(--muted)}
.msg{font-family:Georgia,serif;font-style:italic;color:var(--muted);padding:6vh 0}

.retour{display:block;text-align:center;padding:4vh 0 8vh;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--burgundy)}
.retour:hover{text-decoration:underline}
@media(max-width:600px){.scene{height:54vh}.fleche{width:44px;height:44px;font-size:18px}}
</style>
</head>
<body>
<header class="entete">
  <img class="calli" src="img/mot-Portrait.png" alt="Portrait">
  <p class="accroche">Mettre en lumi&egrave;re un visage, capter une expression, r&eacute;v&eacute;ler ce qui ne se dit pas.</p>
  <div class="trait"></div>
</header>

<div class="viewer">
  <div class="scene" id="scene">
    <div class="msg" id="msg">Chargement des photos&hellip;</div>
  </div>
  <div class="compteur" id="compteur"></div>
</div>

<a class="retour" href="IndexPhotos.html">&larr; Retour</a>

<script>
(function(){
  var REPO = "royvanmil/royvanmil-auteur";
  var DOSSIER = "img/portrait";
  var BRANCHE = "main";

  var scene = document.getElementById('scene');
  var msg = document.getElementById('msg');
  var compteur = document.getElementById('compteur');
  var photos = [], i = 0, imgEl = null;

  var exts = /\.(jpe?g|png|webp|gif)$/i;
  var api = "https://api.github.com/repos/"+REPO+"/contents/"+DOSSIER+"?ref="+BRANCHE;

  fetch(api).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(list){
    photos = list.filter(function(f){return f.type==="file" && exts.test(f.name);})
                 .map(function(f){return f.download_url;});
    if(photos.length===0){ msg.textContent="Aucune photo pour le moment."; return; }
    construire();
    montrer(0);
  }).catch(function(){
    msg.textContent="Photos bient\u00f4t disponibles.";
  });

  function construire(){
    scene.innerHTML = "";
    imgEl = document.createElement('img');
    imgEl.alt = "Photo";
    scene.appendChild(imgEl);
    if(photos.length>1){
      var p = bouton("prev","\u2190"), n = bouton("next","\u2192");
      p.onclick = function(){montrer(i-1);};
      n.onclick = function(){montrer(i+1);};
      scene.appendChild(p); scene.appendChild(n);
    }
  }
  function bouton(cls,txt){
    var b=document.createElement('button');
    b.className="fleche "+cls; b.textContent=txt;
    b.setAttribute('aria-label', cls==="prev"?"Photo pr\u00e9c\u00e9dente":"Photo suivante");
    return b;
  }
  function montrer(n){
    i = (n+photos.length)%photos.length;
    imgEl.src = photos[i];
    compteur.textContent = (i+1)+" / "+photos.length;
  }
  document.addEventListener('keydown',function(e){
    if(!photos.length) return;
    if(e.key==="ArrowLeft") montrer(i-1);
    if(e.key==="ArrowRight") montrer(i+1);
  });
  var x0=null;
  scene.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  scene.addEventListener('touchend',function(e){
    if(x0===null||!photos.length) return;
    var dx=e.changedTouches[0].clientX-x0;
    if(dx>40) montrer(i-1); else if(dx<-40) montrer(i+1);
    x0=null;
  },{passive:true});
})();
</script>
</body>
</html>
