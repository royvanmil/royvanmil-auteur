<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portrait — Roy Van Mil</title>
<meta name="robots" content="noindex">
<style>
:root{
  --paper:#f4f1eb;
  --ink:#101820;
  --muted:#857e74;
  --burgundy:#7b1f31;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.entete{text-align:center;padding:7vh 8vw 2vh}
.calli{display:block;margin:0 auto;width:min(80vw,540px);height:auto}
.accroche{max-width:620px;margin:1vh auto 0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(17px,2.2vw,21px);line-height:1.6;color:#4d4944;font-style:italic}
.trait{width:90px;height:3px;background:var(--burgundy);margin:3.5vh auto 0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:5vh 6vw 4vh;max-width:1200px;margin:0 auto}
.cadre{aspect-ratio:4/5;background:#d8d3cb;border-radius:2px;background-image:linear-gradient(150deg,#cac4bb,#e2ddd4);display:flex;align-items:flex-end;padding:14px;overflow:hidden}
.cadre span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(16,24,32,.5)}
.cadre img{width:100%;height:100%;object-fit:cover}
.retour{display:block;text-align:center;padding:3vh 0 8vh;font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--burgundy)}
.retour:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="entete">
  <img class="calli" src="img/mot-Portrait.png" alt="Portrait">
  <p class="accroche">Mettre en lumi&egrave;re un visage, capter une expression, r&eacute;v&eacute;ler ce qui ne se dit pas.</p>
  <div class="trait"></div>
</header>

<section class="grille">
  <div class="cadre"><span>Portrait 01</span></div>
  <div class="cadre"><span>Portrait 02</span></div>
  <div class="cadre"><span>Portrait 03</span></div>
  <div class="cadre"><span>Portrait 04</span></div>
  <div class="cadre"><span>Portrait 05</span></div>
  <div class="cadre"><span>Portrait 06</span></div>
</section>

<a class="retour" href="IndexPhotos.html">&larr; Retour</a>
</body>
</html>
