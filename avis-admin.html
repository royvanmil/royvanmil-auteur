<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Modération des avis — Roy Van Mil</title>
<style>
  :root{
    --bord:#e0e0e0; --texte:#1a1a1a; --gris:#666;
    --bleu:#2563eb; --vert:#16a34a; --rouge:#dc2626;
    --fond-carte:#fafafa; --jaune:#fef9e7; --jaune-bord:#f0d98a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#fff;color:var(--texte);
    line-height:1.5;padding:1.5rem;max-width:900px;margin:0 auto;
  }
  h1{font-size:1.8rem;margin-bottom:.3rem}
  .sous{color:var(--gris);margin-bottom:1.5rem;font-size:.95rem}

  .connexion{
    background:var(--fond-carte);border:1px solid var(--bord);
    border-radius:10px;padding:1.2rem;margin-bottom:1.5rem;
    display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;
  }
  .connexion input{
    padding:.6rem .8rem;border:1px solid var(--bord);border-radius:7px;
    font-size:1rem;flex:1;min-width:200px;
  }
  .connexion button{
    padding:.6rem 1.3rem;border:none;border-radius:7px;
    background:var(--bleu);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;
  }
  .connexion button:hover{background:#1d4ed8}
  .msg{font-size:.9rem;color:var(--rouge);width:100%}

  .cache{display:none}

  h2{font-size:1.3rem;margin:2rem 0 1rem;padding-bottom:.5rem;border-bottom:2px solid var(--bord)}
  h2 .compte{font-size:.9rem;color:var(--gris);font-weight:normal;margin-left:.5rem}

  .avis{
    border:1px solid var(--bord);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1rem;
    background:var(--fond-carte);
  }
  .avis.attente{background:var(--jaune);border-color:var(--jaune-bord)}
  .avis-tete{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap}
  .avis-nom{font-weight:700;font-size:1.1rem}
  .avis-note{font-size:1.05rem;letter-spacing:.05em}
  .avis-date{font-size:.82rem;color:var(--gris)}
  .avis-livres{font-size:.88rem;color:var(--gris);font-style:italic;margin-bottom:.5rem}
  .avis-texte{font-size:1.02rem;line-height:1.6;margin-bottom:.9rem;white-space:pre-wrap;word-break:break-word}
  .avis-actions{display:flex;gap:.6rem;flex-wrap:wrap}
  .btn{padding:.45rem 1rem;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid;background:#fff;transition:all .15s}
  .btn-publier{border-color:var(--vert);color:var(--vert)}
  .btn-publier:hover{background:var(--vert);color:#fff}
  .btn-cacher{border-color:var(--gris);color:var(--gris)}
  .btn-cacher:hover{background:var(--gris);color:#fff}
  .btn-supprimer{border-color:var(--rouge);color:var(--rouge)}
  .btn-supprimer:hover{background:var(--rouge);color:#fff}

  .vide{color:var(--gris);font-style:italic;padding:1rem 0}
  .rafraichir{
    display:block;margin:2rem auto 0;padding:.6rem 1.4rem;
    border:1px solid var(--bord);border-radius:7px;background:#fff;
    font-size:.95rem;cursor:pointer;
  }
  .rafraichir:hover{background:#f3f4f6}
</style>
</head>
<body>

  <h1>Modération des avis</h1>
  <p class="sous">Validez ou supprimez les témoignages reçus — royvanmil.fr</p>

  <div class="connexion" id="connexion">
    <input type="password" id="mdp" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')connecter()">
    <button onclick="connecter()">Entrer</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="contenu" class="cache">
    <h2>À valider <span class="compte" id="compte-attente"></span></h2>
    <div id="liste-attente"></div>

    <h2>Publiés <span class="compte" id="compte-publie"></span></h2>
    <div id="liste-publie"></div>

    <button class="rafraichir" onclick="charger()">↻ Rafraîchir</button>
  </div>

<script>
  var API = "https://compteurs.royvanmil86.workers.dev";
  var MDP = "";

  var LIVRES = {
    "cette-maison": "Cette maison, elle vaut vraiment le prix ?",
    "un-instant": "Un instant, ou Deux…",
    "la-cloche": "La Cloche des Morts",
    "un-instant-trois": "Un instant, ou Trois…"
  };

  function connecter(){
    var val = document.getElementById('mdp').value.trim();
    if(!val){ document.getElementById('msg').textContent = "Entre le mot de passe."; return; }
    MDP = val;
    charger();
  }

  function livresEnTexte(cles){
    return (cles||[]).map(function(c){ return LIVRES[c] || c; }).join(" · ");
  }
  function noteEmoji(n){
    var s=""; for(var i=0;i<5;i++){ s += (i<n) ? "📖" : "▫️"; } return s;
  }
  function dateLisible(iso){
    try{ return new Date(iso).toLocaleString('fr-FR'); }catch(e){ return iso; }
  }

  function charger(){
    fetch(API + "/avis-liste?code=" + encodeURIComponent(MDP))
      .then(function(r){
        if(r.status === 403){ document.getElementById('msg').textContent = "Mot de passe refusé."; return null; }
        return r.json();
      })
      .then(function(avis){
        if(avis === null) return;
        document.getElementById('connexion').classList.add('cache');
        document.getElementById('contenu').classList.remove('cache');

        var attente = avis.filter(function(a){ return a.statut === "attente"; });
        var publie  = avis.filter(function(a){ return a.statut === "publie"; });

        document.getElementById('compte-attente').textContent = attente.length ? "(" + attente.length + ")" : "";
        document.getElementById('compte-publie').textContent  = publie.length ? "(" + publie.length + ")" : "";

        dessiner('liste-attente', attente, true);
        dessiner('liste-publie', publie, false);
      })
      .catch(function(){ document.getElementById('msg').textContent = "Erreur de chargement."; });
  }

  function dessiner(zoneId, liste, enAttente){
    var zone = document.getElementById(zoneId);
    zone.innerHTML = "";
    if(liste.length === 0){
      zone.innerHTML = '<div class="vide">' + (enAttente ? "Aucun avis en attente." : "Aucun avis publié.") + '</div>';
      return;
    }
    liste.forEach(function(e){
      var div = document.createElement('div');
      div.className = 'avis' + (enAttente ? ' attente' : '');

      var actions = enAttente
        ? '<button class="btn btn-publier" data-id="'+e.id+'" data-act="publier">✓ Publier</button>' +
          '<button class="btn btn-supprimer" data-id="'+e.id+'" data-act="supprimer">✕ Supprimer</button>'
        : '<button class="btn btn-cacher" data-id="'+e.id+'" data-act="cacher">Retirer</button>' +
          '<button class="btn btn-supprimer" data-id="'+e.id+'" data-act="supprimer">✕ Supprimer</button>';

      div.innerHTML =
        '<div class="avis-tete">' +
          '<span class="avis-nom"></span>' +
          '<span class="avis-note">' + noteEmoji(e.note) + '</span>' +
        '</div>' +
        '<div class="avis-livres"></div>' +
        '<div class="avis-texte"></div>' +
        '<div class="avis-date">' + dateLisible(e.date) + '</div>' +
        '<div class="avis-actions" style="margin-top:.7rem">' + actions + '</div>';

      div.querySelector('.avis-nom').textContent = e.nom;
      div.querySelector('.avis-livres').textContent = livresEnTexte(e.livres);
      div.querySelector('.avis-texte').textContent = e.avis;

      div.querySelectorAll('.btn').forEach(function(b){
        b.addEventListener('click', function(){ action(b.getAttribute('data-id'), b.getAttribute('data-act')); });
      });

      zone.appendChild(div);
    });
  }

  function action(id, act){
    if(act === "supprimer" && !confirm("Supprimer définitivement cet avis ?")) return;
    fetch(API + "/avis-action?code=" + encodeURIComponent(MDP) + "&id=" + encodeURIComponent(id) + "&action=" + act)
      .then(function(r){
        if(r.status === 403){ alert("Mot de passe refusé."); return; }
        return r.json();
      })
      .then(function(res){
        if(res && res.ok){ charger(); }
        else if(res){ alert("Erreur : " + (res.erreur || "inconnue")); }
      })
      .catch(function(){ alert("Erreur réseau."); });
  }
</script>
</body>
</html>
