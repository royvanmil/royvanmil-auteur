<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Livres – Renseignements</title>
<style>
  :root { --fond:#fbfaf5; --encre:#1e2320; --vert:#3d8b3d; --gris:#6f7a66; --bord:#c9cdc0; --pale:#e4e6dc; --rouge:#b3261e; --jaune:#ffd200; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: Georgia, "Times New Roman", serif; background:#eef0e8; color:var(--encre); padding:1rem; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.7rem; margin:.3rem 0 .2rem; }
  .sous { color:var(--gris); font-style:italic; margin-bottom:1rem; }
  nav { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
  nav a { text-decoration:none; color:var(--encre); background:#fff; border:1px solid var(--bord); padding:.45rem .9rem; border-radius:7px; font-size:.95rem; }
  nav a.actif { background:var(--encre); color:#fff; border-color:var(--encre); }
  .carte { background:var(--fond); border:1px solid var(--bord); border-radius:10px; padding:1rem 1.1rem; margin-bottom:1rem; }
  .carte h2 { font-size:1.2rem; margin-bottom:.8rem; }
  label { display:block; font-size:.9rem; color:var(--gris); margin-bottom:.2rem; }
  input[type=text], input[type=password], input[type=search] {
    width:100%; padding:.6rem .7rem; border:1px solid var(--bord); border-radius:7px; font-size:1rem; font-family:inherit; background:#fff;
  }
  .grille { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  .plein { grid-column:1 / -1; }
  .livres { margin-top:1rem; border-top:1px solid var(--pale); padding-top:.8rem; }
  .livre { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; padding:.5rem 0; border-bottom:1px dotted var(--bord); }
  .livre .titre { flex:1 1 220px; font-weight:bold; font-size:.95rem; }
  .coche { display:flex; align-items:center; gap:.35rem; font-size:.95rem; cursor:pointer; user-select:none; }
  .coche input { width:1.2rem; height:1.2rem; accent-color:var(--vert); cursor:pointer; }
  .boutons { display:flex; gap:.6rem; margin-top:1rem; flex-wrap:wrap; }
  button { font-family:inherit; font-size:1rem; padding:.6rem 1.2rem; border-radius:7px; border:1px solid var(--encre); background:#fff; cursor:pointer; }
  button.principal { background:var(--vert); border-color:var(--vert); color:#fff; font-weight:bold; }
  button.danger { color:var(--rouge); border-color:var(--rouge); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid #1f3b73; outline-offset:2px; }
  .msg { margin-top:.7rem; font-size:.95rem; min-height:1.2em; }
  .msg.ok { color:var(--vert); } .msg.err { color:var(--rouge); }
  .pers { display:flex; gap:.8rem; align-items:flex-start; padding:.7rem 0; border-bottom:1px solid var(--pale); flex-wrap:wrap; }
  .pers:last-child { border-bottom:none; }
  .pers .info { flex:1 1 260px; }
  .pers .nom { font-weight:bold; }
  .pers .adr, .pers .note { font-size:.9rem; color:#2e3530; }
  .pers .note { color:var(--gris); font-style:italic; }
  .badges { display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.3rem; }
  .badge { font-size:.8rem; padding:.1rem .45rem; border-radius:5px; border:1px solid var(--bord); background:#fff; }
  .badge.don { border-color:var(--vert); color:var(--vert); }
  .badge.achat { border-color:#1f3b73; color:#1f3b73; }
  .pers .actions { display:flex; gap:.4rem; }
  .pers .actions button { font-size:.9rem; padding:.35rem .8rem; }
  .enedit { background:#fff8d6; border-radius:8px; padding-left:.5rem; padding-right:.5rem; }
  #appli { display:none; }
  @media (max-width:600px) { .grille { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Livres – Renseignements</h1>
  <div class="sous">Ajouter ou modifier une personne. Les listes Dons et Achats se mettent à jour toutes seules.</div>
  <nav>
    <a href="livres-renseignements.html" class="actif">Renseignements</a>
    <a href="livres-dons.html">Liste dons</a>
    <a href="livres-achats.html">Liste achats</a>
    <a href="affiches.html">Affiches</a>
    <a href="comptes.html">Comptes</a>
    <a href="presence.html">Présence</a>
  </nav>

  <div class="carte" id="connexion">
    <h2>Mot de passe</h2>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
      <input type="password" id="mdp" placeholder="Mot de passe" style="flex:1;min-width:200px" autocomplete="current-password">
      <button class="principal" id="btnEntrer">Entrer</button>
    </div>
    <div class="msg" id="msgConnexion"></div>
  </div>

  <div id="appli">
    <div class="carte" id="formCarte">
      <h2 id="formTitre">Nouvelle personne</h2>
      <div class="grille">
        <div><label for="prenom">Prénom</label><input type="text" id="prenom"></div>
        <div><label for="nom">Nom</label><input type="text" id="nom"></div>
        <div class="plein"><label for="adresse">Adresse</label><input type="text" id="adresse"></div>
        <div class="plein"><label for="cpville">Code postal + Ville</label><input type="text" id="cpville"></div>
        <div class="plein"><label for="note">Note (date d'envoi, remarque…)</label><input type="text" id="note"></div>
      </div>
      <div class="livres" id="livresForm"></div>
      <div class="boutons">
        <button class="principal" id="btnEnregistrer">Enregistrer</button>
        <button id="btnAnnuler">Vider / annuler</button>
      </div>
      <div class="msg" id="msgForm"></div>
    </div>

    <div class="carte">
      <h2>Toutes les personnes (<span id="nb">0</span>)</h2>
      <input type="search" id="recherche" placeholder="Rechercher un nom, une ville…" style="margin-bottom:.6rem">
      <div id="liste"></div>
    </div>
  </div>
</div>

<script>
  var API = "https://compteurs.royvanmil86.workers.dev";
  var TITRES = { "1": "Livre 1 – Cette maison, elle vaut vraiment le prix ?", "2": "Livre 2 – Un instant, ou Deux…", "3": "Livre 3 – Un instant, ou Trois…" };
  var personnes = [];
  var enEdition = null;
  var code = sessionStorage.getItem("livresCode") || "";

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t || "").replace(/[&<>"']/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }

  // cases livres du formulaire
  (function () {
    var h = "";
    ["1","2","3"].forEach(function (n) {
      h += '<div class="livre"><div class="titre">' + TITRES[n] + '</div>' +
        '<label class="coche"><input type="checkbox" id="don' + n + '"> Donné</label>' +
        '<label class="coche"><input type="checkbox" id="achat' + n + '"> Acheté</label>' +
        '<label class="coche"><input type="checkbox" id="envoi' + n + '"> + envoi</label></div>';
    });
    $("livresForm").innerHTML = h;
    ["1","2","3"].forEach(function (n) {
      // Donné et Acheté s'excluent ; + envoi coche automatiquement Donné si rien n'est choisi
      $("don" + n).addEventListener("change", function () { if (this.checked) $("achat" + n).checked = false; else $("envoi" + n).checked = false; });
      $("achat" + n).addEventListener("change", function () { if (this.checked) $("don" + n).checked = false; else $("envoi" + n).checked = false; });
      $("envoi" + n).addEventListener("change", function () { if (this.checked && !$("don" + n).checked && !$("achat" + n).checked) $("don" + n).checked = true; });
    });
  })();

  function message(id, txt, ok) { var m = $(id); m.textContent = txt; m.className = "msg " + (ok ? "ok" : "err"); }

  function charger() {
    return fetch(API + "/livres-liste?code=" + encodeURIComponent(code))
      .then(function (r) { if (r.status === 403) throw new Error("mdp"); return r.json(); })
      .then(function (data) {
        personnes = data;
        sessionStorage.setItem("livresCode", code);
        $("connexion").style.display = "none";
        $("appli").style.display = "block";
        afficher();
      })
      .catch(function (e) {
        sessionStorage.removeItem("livresCode");
        $("connexion").style.display = "block";
        $("appli").style.display = "none";
        message("msgConnexion", e.message === "mdp" ? "Mot de passe refusé." : "Erreur réseau, réessaie.", false);
      });
  }

  function sauver(texteOk) {
    return fetch(API + "/livres-save?code=" + encodeURIComponent(code), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ personnes: personnes })
    })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function () { message("msgForm", texteOk, true); return charger(); })
    .catch(function () { message("msgForm", "Erreur : rien n'a été enregistré. Réessaie.", false); return charger(); });
  }

  function nomComplet(p) { return (p.prenom ? p.prenom + " " : "") + p.nom; }

  function afficher() {
    var q = $("recherche").value.trim().toLowerCase();
    var h = "";
    var n = 0;
    personnes.forEach(function (p) {
      var texte = (nomComplet(p) + " " + p.adresse + " " + p.cpville + " " + p.note).toLowerCase();
      if (q && texte.indexOf(q) === -1) return;
      n++;
      var badges = "";
      ["1","2","3"].forEach(function (k) {
        var l = p.livres[k];
        if (l && l.etat) badges += '<span class="badge ' + l.etat + '">Livre ' + k + (l.etat === "don" ? " donné" : " acheté") + (l.envoi ? " + envoi" : "") + '</span>';
      });
      h += '<div class="pers' + (enEdition === p.id ? " enedit" : "") + '"><div class="info">' +
        '<div class="nom">' + esc(nomComplet(p)) + '</div>' +
        '<div class="adr">' + esc([p.adresse, p.cpville].filter(Boolean).join(", ")) + '</div>' +
        (p.note ? '<div class="note">' + esc(p.note) + '</div>' : "") +
        '<div class="badges">' + (badges || '<span class="badge">Aucun livre</span>') + '</div></div>' +
        '<div class="actions"><button data-mod="' + esc(p.id) + '">Modifier</button>' +
        '<button class="danger" data-sup="' + esc(p.id) + '">Supprimer</button></div></div>';
    });
    $("liste").innerHTML = h || "<p>Personne pour l'instant.</p>";
    $("nb").textContent = personnes.length;
  }

  function vider() {
    enEdition = null;
    ["prenom","nom","adresse","cpville","note"].forEach(function (c) { $(c).value = ""; });
    ["1","2","3"].forEach(function (n) { $("don"+n).checked = false; $("achat"+n).checked = false; $("envoi"+n).checked = false; });
    $("formTitre").textContent = "Nouvelle personne";
    $("btnEnregistrer").textContent = "Enregistrer";
    afficher();
  }

  function remplir(p) {
    enEdition = p.id;
    $("prenom").value = p.prenom; $("nom").value = p.nom; $("adresse").value = p.adresse;
    $("cpville").value = p.cpville; $("note").value = p.note;
    ["1","2","3"].forEach(function (n) {
      var l = p.livres[n] || {};
      $("don"+n).checked = l.etat === "don"; $("achat"+n).checked = l.etat === "achat"; $("envoi"+n).checked = !!l.envoi;
    });
    $("formTitre").textContent = "Modifier : " + nomComplet(p);
    $("btnEnregistrer").textContent = "Enregistrer les modifications";
    message("msgForm", "", true);
    afficher();
    $("formCarte").scrollIntoView({ behavior: "smooth" });
  }

  $("btnEntrer").addEventListener("click", function () { code = $("mdp").value; charger(); });
  $("mdp").addEventListener("keydown", function (e) { if (e.key === "Enter") { code = this.value; charger(); } });
  $("recherche").addEventListener("input", afficher);
  $("btnAnnuler").addEventListener("click", function () { vider(); message("msgForm", "", true); });

  $("btnEnregistrer").addEventListener("click", function () {
    var fiche = {
      id: enEdition || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
      prenom: $("prenom").value.trim(), nom: $("nom").value.trim(),
      adresse: $("adresse").value.trim(), cpville: $("cpville").value.trim(), note: $("note").value.trim(),
      livres: {}
    };
    if (!fiche.prenom && !fiche.nom) { message("msgForm", "Mets au moins un prénom ou un nom.", false); return; }
    ["1","2","3"].forEach(function (n) {
      var etat = $("don"+n).checked ? "don" : ($("achat"+n).checked ? "achat" : "");
      fiche.livres[n] = { etat: etat, envoi: etat !== "" && $("envoi"+n).checked };
    });
    if (enEdition) {
      personnes = personnes.map(function (p) { return p.id === enEdition ? fiche : p; });
    } else {
      personnes.push(fiche);
    }
    var nomFiche = nomComplet(fiche);
    vider();
    sauver("Enregistré : " + nomFiche);
  });

  $("liste").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var idMod = b.getAttribute("data-mod"), idSup = b.getAttribute("data-sup");
    if (idMod) { var p = personnes.filter(function (x) { return x.id === idMod; })[0]; if (p) remplir(p); }
    if (idSup) {
      var q = personnes.filter(function (x) { return x.id === idSup; })[0];
      if (q && confirm("Supprimer " + nomComplet(q) + " ? C'est définitif.")) {
        personnes = personnes.filter(function (x) { return x.id !== idSup; });
        if (enEdition === idSup) vider();
        sauver("Supprimé : " + nomComplet(q));
      }
    }
  });

  if (code) charger();
</script>
</body>
</html>
