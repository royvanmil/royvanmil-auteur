<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C0S0P1D</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif; color:#1f2830; }

  .page { width:210mm; height:297mm; background:#fff; padding:8mm;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; }

  .code { position:absolute; top:8mm; right:9mm; font-family:"Segoe UI",Arial,sans-serif;
    font-size:10pt; font-weight:600; color:#9aa7b3; letter-spacing:.5px; }

  .booktitle { font-size:44pt; font-weight:700; letter-spacing:-.5px; color:#1f2830; }
  .rule { width:52mm; height:3px; background:#2a6cb8; border-radius:2px; margin:9mm 0; }
  .author { position:absolute; bottom:18mm; font-size:16pt; font-weight:600; color:#2a6cb8; }

  /* Centrage APERÇU — écran seulement, et uniquement si la page est ouverte seule */
  @media screen {
    html.apercu { background:#e9edf1; }
    html.apercu body { display:flex; justify-content:center; align-items:flex-start; padding:22px 0; }
    html.apercu .page { box-shadow:0 6px 26px rgba(0,0,0,.16); }
  }
  @media print { html.apercu body{display:block;padding:0;} html.apercu .page{box-shadow:none;} }
</style>
</head>
<body>
<div class="page">
  <div class="code">C0S0P1D</div>
  <div class="booktitle">Explique-moi,&nbsp;Roy…</div>
  <div class="rule"></div>
  <div class="author">Roy van Mil</div>
</div>
<script>
  if (window.self === window.top) document.documentElement.classList.add('apercu');
</script>
</body>
</html>
