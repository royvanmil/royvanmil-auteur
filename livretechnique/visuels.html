<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Visuels — double-page</title>
<style>
  :root{ --bg:#f4f7fa; --ink:#24313f; --muted:#5b6b7a; --line:#e2e9f0; --fr:#2a6cb8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{ height:100%; overflow:hidden; }
  body{ background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; }

  .top{ padding:10px 16px; flex:0 0 auto; }
  .top a{ color:var(--fr); text-decoration:none; font-weight:500; font-size:15px; }
  .top a:hover{text-decoration:underline;}

  .reader{ flex:1; display:flex; align-items:center; justify-content:center;
    gap:16px; padding:0 10px; min-height:0; }

  .arrow{ flex:0 0 auto; width:48px;height:48px; border:1px solid var(--line);
    background:#fff; border-radius:50%; font-size:20px; color:var(--ink); cursor:pointer;
    display:flex;align-items:center;justify-content:center; transition:background .12s; }
  .arrow:hover{background:#eef3f8;}
  .arrow:disabled{opacity:.3;cursor:default;}

  /* .stage = taille réelle réduite du duo ; .spread mis à l'échelle dedans */
  .stage{ position:relative; flex:0 0 auto; }
  .spread{ display:flex; gap:14px; transform-origin:top left; }

  /* A4 exact en pixels (96 dpi) : 210mm=794 · 297mm=1123 */
  .pageframe{ width:794px; height:1123px; background:#fff;
    border:1px solid var(--line); border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.08); overflow:hidden; }
  .pageframe iframe{ width:794px; height:1123px; border:0; display:block; }

  .pos{ text-align:center; color:var(--muted); font-size:13px; padding:6px 0 10px; flex:0 0 auto; }
</style>
</head>
<body>

  <div class="top"><a href="index.html">← retour index</a></div>

  <div class="reader">
    <button class="arrow" id="prev" aria-label="Paire précédente">◀</button>
    <div class="stage" id="stage">
      <div class="spread" id="spread">
        <div class="pageframe"><iframe id="pageG" src="" title="Page gauche"></iframe></div>
        <div class="pageframe"><iframe id="pageD" src="" title="Page droite"></iframe></div>
      </div>
    </div>
    <button class="arrow" id="next" aria-label="Paire suivante">▶</button>
  </div>

  <div class="pos" id="pos"></div>

<script>
  /* ====== LISTE DES DOUBLES-PAGES (une ligne = une paire G + D) ====== */
  const PAIRES = [
    { g:"C0S0P1G.html", d:"C0S0P1D.html" },
    { g:"C0S0P2G.html", d:"C0S0P2D.html" }
    // { g:"C0S0P3G.html", d:"C0S0P3D.html" },
  ];

  const A4W = 794, A4H = 1123, GAP = 14;
  const NAT_W = A4W*2 + GAP, NAT_H = A4H;

  let i = 0;
  const $ = id => document.getElementById(id);
  const pageG=$("pageG"), pageD=$("pageD"), prev=$("prev"), next=$("next"),
        pos=$("pos"), stage=$("stage"), spread=$("spread");

  function fit(){
    const availW = window.innerWidth  - 170;   // flèches + gaps + marges
    const availH = window.innerHeight - 100;    // barre haut + compteur + marges
    let k = Math.min(availW / NAT_W, availH / NAT_H);
    if (k > 1.6) k = 1.6;                        // pas de sur-zoom
    if (k < 0.05) k = 0.05;
    spread.style.transform = "scale(" + k + ")";
    stage.style.width  = (NAT_W * k) + "px";
    stage.style.height = (NAT_H * k) + "px";
  }

  function afficher(){
    pageG.src = PAIRES[i].g;
    pageD.src = PAIRES[i].d;
    prev.disabled = (i === 0);
    next.disabled = (i === PAIRES.length - 1);
    pos.textContent = "Double-page " + (i+1) + " / " + PAIRES.length;
  }

  prev.addEventListener("click", () => { if(i>0){ i--; afficher(); } });
  next.addEventListener("click", () => { if(i<PAIRES.length-1){ i++; afficher(); } });
  document.addEventListener("keydown", e => {
    if(e.key==="ArrowLeft")  prev.click();
    if(e.key==="ArrowRight") next.click();
  });
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  window.addEventListener("load", fit);
  pageG.addEventListener("load", fit);
  pageD.addEventListener("load", fit);

  afficher();
  fit();
  requestAnimationFrame(fit);
</script>

</body>
</html>
