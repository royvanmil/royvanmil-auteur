<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Visuels — double-page</title>
<style>
  :root{ --bg:#f4f7fa; --ink:#24313f; --muted:#5b6b7a; --line:#e2e9f0; --fr:#2a6cb8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{ height:100%; overflow:hidden; }
  body{ background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; }

  .top{ padding:10px 16px; flex:0 0 auto; }
  .top a{ color:var(--fr); text-decoration:none; font-weight:500; font-size:15px; }
  .top a:hover{text-decoration:underline;}

  .reader{ flex:1; display:flex; align-items:center; justify-content:center;
    gap:16px; padding:0 10px; min-height:0; overflow:hidden; }

  .arrow{ flex:0 0 auto; width:48px;height:48px; border:1px solid var(--line);
    background:#fff; border-radius:50%; font-size:20px; color:var(--ink); cursor:pointer;
    display:flex;align-items:center;justify-content:center; transition:background .12s; }
  .arrow:hover{background:#eef3f8;}
  .arrow:disabled{opacity:.3;cursor:default;}

  .spread{ display:flex; gap:12px; flex:0 0 auto; }

  /* Chaque cadre est un rectangle A4 réduit ; l'iframe (taille A4 réelle) est mise à l'échelle DEDANS */
  .pageframe{ position:relative; overflow:hidden; background:#fff;
    border:1px solid var(--line); border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .pageframe iframe{ position:absolute; top:0; left:0; width:794px; height:1123px;
    border:0; transform-origin:top left; }

  .pos{ text-align:center; color:var(--muted); font-size:13px; padding:6px 0 10px; flex:0 0 auto; }
</style>
</head>
<body>

  <div class="top"><a href="index.html">← retour index</a></div>

  <div class="reader" id="reader">
    <button class="arrow" id="prev" aria-label="Paire précédente">◀</button>
    <div class="spread" id="spread">
      <div class="pageframe" id="frameG"><iframe id="pageG" src="" title="Page gauche"></iframe></div>
      <div class="pageframe" id="frameD"><iframe id="pageD" src="" title="Page droite"></iframe></div>
    </div>
    <button class="arrow" id="next" aria-label="Paire suivante">▶</button>
  </div>

  <div class="pos" id="pos"></div>

<script>
  /* ====== LISTE DES DOUBLES-PAGES (une ligne = une paire G + D) ====== */
  const PAIRES = [
    { g:"C0S0P1G.html", d:"C0S0P1D.html" },
    { g:"C0S0P2G.html", d:"C0S0P2D.html" },
    { g:"C0S0P3G.html", d:"C0S0P3D.html" }
  ];

  const A4W = 794, A4H = 1123, GAP = 12;   // GAP doit = .spread gap
  const NAT_W = A4W*2 + GAP;

  let i = 0;
  const $ = id => document.getElementById(id);
  const reader=$("reader"), spread=$("spread"),
        frameG=$("frameG"), frameD=$("frameD"),
        pageG=$("pageG"), pageD=$("pageD"),
        prev=$("prev"), next=$("next"), pos=$("pos");

  function fit(){
    // zone réellement dispo DANS le lecteur (mesurée, pas devinée)
    const availW = reader.clientWidth  - 48*2 - 16*2 - 6;  // 2 flèches + 2 gaps + marge
    const availH = reader.clientHeight - 6;
    if (availW <= 0 || availH <= 0) return;
    let k = Math.min(availW / NAT_W, availH / A4H);
    if (k > 1.5) k = 1.5;
    const w = Math.floor(A4W*k), h = Math.floor(A4H*k);
    [frameG, frameD].forEach(f => { f.style.width = w+"px"; f.style.height = h+"px"; });
    [pageG, pageD].forEach(p => { p.style.transform = "scale("+k+")"; });
  }

  function afficher(){
    pageG.src = PAIRES[i].g;
    pageD.src = PAIRES[i].d;
    prev.disabled = (i === 0);
    next.disabled = (i === PAIRES.length - 1);
    pos.textContent = "Double-page " + (i+1) + " / " + PAIRES.length;
  }

  prev.addEventListener("click", () => { if(i>0){ i--; afficher(); } });
  next.addEventListener("click", () => { if(i<PAIRES.length-1){ i++; afficher(); } });
  document.addEventListener("keydown", e => {
    if(e.key==="ArrowLeft")  prev.click();
    if(e.key==="ArrowRight") next.click();
  });

  if (window.ResizeObserver) new ResizeObserver(fit).observe(reader);
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  window.addEventListener("load", fit);

  afficher();
  fit();
</script>

</body>
</html>
