<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuel Maison — Nastasia</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#f3efe9;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 16px 50px;
  }
  .affiche{
    width:100%;
    max-width:620px;
    display:block;
    border-radius:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  .btn{
    display:inline-block;
    margin-top:34px;
    background:#c1121f;
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:16px 54px;
    border-radius:6px;
    box-shadow:0 6px 18px rgba(193,18,31,.35);
    transition:transform .12s, background .12s;
  }
  .btn:hover{background:#a00e19;transform:translateY(-2px)}
</style>
</head>
<body>
  <img class="affiche" src="img/couverture.jpg" alt="Manuel Maison — Lagraulet-du-Gers">
  <a class="btn" href="sommaire.html">Sommaire</a>
</body>
</html>
