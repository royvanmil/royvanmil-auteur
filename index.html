<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roy Van Mil — Auteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#e8dcc4;
  --laiton:#c9a25e;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#0b0806;min-height:100%;overflow-x:hidden;}

.piece{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3vh 0;
}

.scene{
  position:relative;
  width:min(100vw,1100px);
  aspect-ratio:1536/1024;
  background:url("img/armoire-fond.png") center/cover no-repeat;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}

.invite{
  position:absolute;
  top:6%;left:0;right:0;
  text-align:center;
  z-index:3;
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:clamp(1.1rem,2.6vw,2rem);
  color:#f4ecd8;
  text-shadow:0 2px 16px rgba(0,0,0,.9);
  opacity:0;
  animation:fade 2.4s ease .5s forwards;
  padding:0 4%;
}
.invite small{
  display:block;
  margin-top:.4rem;
  font-family:'EB Garamond',serif;
  font-size:.5em;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--laiton);
  opacity:.8;
}

.livres{
  position:absolute;
  top:38%;
  left:26%;
  right:26%;
  bottom:30%;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:2%;
  z-index:2;
}

.livre{
  position:relative;
  flex:1;
  max-width:31%;
  display:block;
  cursor:pointer;
  outline:none;
  transition:transform .35s ease, filter .35s ease;
  transform-origin:bottom center;
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.75));
}
.livre img{
  width:100%;
  display:block;
  border-radius:2px 3px 3px 2px;
  box-shadow:2px 3px 8px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4);
}
.livre::after{
  content:"";
  position:absolute;
  bottom:-8px;left:6%;right:6%;
  height:10px;
  background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 75%);
  filter:blur(2px);
}
.livre:hover,
.livre:focus-visible{
  transform:translateY(-12px) scale(1.05);
  filter:drop-shadow(0 22px 24px rgba(0,0,0,.8)) brightness(1.12);
  z-index:5;
}

@keyframes fade{to{opacity:1;}}

@media(prefers-reduced-motion:reduce){
  .invite{animation:none;opacity:1;}
}
</style>
</head>
<body>
<main class="piece">
  <div class="scene">

    <p class="invite">
      Chaque livre ouvre une porte différente.
      <small>Choisissez une couverture pour entrer dans son univers</small>
    </p>

    <div class="livres">
      <a class="livre" href="cette-maison.html" aria-label="Cette maison, elle vaut vraiment le prix ?">
        <img src="img/couv-cette-maison.jpg" alt="Couverture — Cette maison, elle vaut vraiment le prix ?">
      </a>
      <a class="livre" href="un-instant.html" aria-label="Un instant, ou Deux...">
        <img src="img/couv-un-instant.png" alt="Couverture — Un instant, ou Deux...">
      </a>
      <a class="livre" href="la-cloche-des-morts.html" aria-label="La Cloche des Morts">
        <img src="img/couv-cloche.png" alt="Couverture — La Cloche des Morts">
      </a>
    </div>

  </div>
</main>
</body>
</html>
