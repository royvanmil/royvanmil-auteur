<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roy van Mil — Schrijver</title>
<meta name="description" content="Roy van Mil, schrijver in Frankrijk. Zijn boeken in het Nederlands — kies een boek in de kast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#e8dcc4;
    --laiton:#c9a25e;
    /* Nederlandse vlag */
    --nl-rood:#AE1C28;
    --nl-wit:#ffffff;
    --nl-blauw:#21468B;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#0b0806;
    min-height:100%;
    overflow-x:hidden;
    font-family:'EB Garamond',Georgia,serif;
  }

  /* ===== Kleine taalschakelaar (linksboven) ===== */
  .taal{
    position:fixed; top:12px; left:14px; z-index:60;
    display:flex; gap:8px; align-items:center;
    font-family:'EB Garamond',serif;
  }
  .taal a{
    display:inline-flex; align-items:center; gap:.35em;
    text-decoration:none; color:var(--creme);
    font-size:.9rem; letter-spacing:.04em;
    padding:.25em .6em; border-radius:20px;
    background:rgba(0,0,0,.35); border:1px solid rgba(201,162,94,.4);
    opacity:.75; transition:opacity .3s ease, transform .3s ease;
  }
  .taal a:hover{opacity:1; transform:translateY(-1px)}

  /* ===== De kamer / kast ===== */
  .piece{
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:1.5vh 0 5vh;
  }

  .entete{
    text-align:center; width:100%;
    padding:0 8vw; margin-bottom:1.6vh;
    opacity:0; animation:fade 2s ease .2s forwards;
  }
  /* Vlag boven de titel */
  .vlag-wrap{
    width:clamp(96px,15vw,150px);
    margin:0 auto .6vh;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.6));
  }
  .vlag-wrap svg, .vlag-wrap img{display:block; width:100%; height:auto; border-radius:5px}

  .entete h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:700; color:#f4ecd8;
    font-size:clamp(2.8rem,8vw,4.6rem);
    margin:.05em 0 .02em; letter-spacing:.5px;
    text-shadow:0 2px 24px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.6);
  }
  .role{
    margin-top:0;
    font-family:'EB Garamond',serif; font-weight:700;
    font-size:clamp(1.2rem,3vw,1.9rem);
    letter-spacing:.55em; text-transform:uppercase;
    color:#fff; padding-left:.55em;
    text-shadow:0 2px 16px rgba(0,0,0,.9);
  }

  .scene{
    position:relative;
    width:min(100vw,1100px);
    aspect-ratio:1536/1024;
    background:url("../img/armoire-fond.png") center/cover no-repeat;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
  }

  .invite{
    position:absolute; top:6%; left:0; right:0;
    text-align:center; z-index:3;
    font-family:'Cormorant Garamond',serif; font-weight:500;
    font-size:clamp(1.1rem,2.6vw,2rem);
    color:#f4ecd8; text-shadow:0 2px 16px rgba(0,0,0,.9);
    opacity:0; animation:fade 2.4s ease .5s forwards; padding:0 4%;
  }
  .invite small{
    display:block;
    font-size:clamp(.7rem,1.5vw,1rem);
    letter-spacing:.05em; opacity:.85; margin-top:.2em;
  }

  .livres{
    position:absolute; left:26%; right:26%;
    display:flex; align-items:flex-end; justify-content:space-around;
    gap:2%; z-index:2;
  }
  .livres-haut{top:24%; height:23%}
  .livres-bas{top:55%; height:25%}

  .livre{
    position:relative; flex:1; max-width:22%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:pointer; outline:none; text-decoration:none;
    transition:transform .35s ease, filter .35s ease;
    transform-origin:bottom center;
    filter:drop-shadow(0 12px 14px rgba(0,0,0,.75));
  }
  .livre img{
    width:100%; flex:1; min-height:0; object-fit:fill; display:block;
    border-radius:2px 3px 3px 2px;
    box-shadow:2px 3px 8px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4);
  }
  .livre:hover, .livre:focus-visible{
    transform:translateY(-8px) scale(1.04);
    filter:drop-shadow(0 20px 22px rgba(0,0,0,.85));
    z-index:5;
  }

  /* Label onder het boek (verschijnt bij hover) */
  .etiket{
    position:absolute; bottom:-10%;
    left:50%; transform:translateX(-50%) translateY(6px);
    font-family:'EB Garamond',serif; font-weight:700;
    font-size:clamp(.7rem,1.4vw,.95rem);
    letter-spacing:.08em; white-space:nowrap;
    color:#111; background:#fff; padding:.25em 1em;
    border-radius:3px; box-shadow:0 3px 10px rgba(0,0,0,.7);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .livre:hover .etiket, .livre:focus-visible .etiket{
    opacity:1; transform:translateX(-50%) translateY(0);
  }
  .etiket.binnenkort{background:var(--laiton); color:#111}

  /* "Binnenkort" gemarkeerde boeken iets gedimd */
  .livre.soon img{filter:grayscale(.25) brightness(.82)}
  .livre.soon:hover img{filter:grayscale(0) brightness(.95)}

  /* ===== Auteur foto (rond, groot, onderaan) ===== */
  .auteur-blok{
    text-align:center;
    margin:6vh auto 1vh;
    opacity:0; animation:fade 2s ease .3s forwards;
  }
  .auteur-foto{
    width:clamp(300px,45vw,500px);
    aspect-ratio:1/1;
    border-radius:50%;
    object-fit:cover; object-position:center 22%;
    border:6px solid #fff;
    box-shadow:0 18px 44px rgba(0,0,0,.7), 0 0 0 4px var(--laiton);
  }
  .auteur-naam{
    font-family:'Cormorant Garamond',serif; font-weight:700;
    color:#f4ecd8; font-size:clamp(1.8rem,4.5vw,2.8rem);
    margin:.5em 0 .05em; letter-spacing:.4px;
    text-shadow:0 2px 18px rgba(0,0,0,.9);
  }
  .auteur-sub{
    font-family:'EB Garamond',serif; font-style:italic;
    color:var(--creme); font-size:clamp(1rem,2.4vw,1.35rem);
    margin:0; opacity:.9;
  }

  @keyframes fade{to{opacity:1}}
  @media(max-width:600px){
    .role{letter-spacing:.35em}
    .etiket{font-size:.68rem}
  }
</style>
</head>
<body>

  <!-- Taalschakelaar -->
  <nav class="taal" aria-label="Taal / Langue">
    <a href="../index.html" title="Version française">🇫🇷 Frans</a>
  </nav>

  <main class="piece">
    <header class="entete">
      <!-- Nederlandse vlag -->
      <div class="vlag-wrap">
        <img src="img/drapeaunl.png" alt="Nederlandse vlag">
      </div>

      <h1>Roy van Mil</h1>
      <p class="role">Schrijver</p>
    </header>

    <div class="scene">

      <p class="invite">
        Klik op een boek
        <small>om zijn wereld te ontdekken</small>
      </p>

      <div class="livres livres-haut">
        <a class="livre soon" href="#" aria-label="Cette maison — binnenkort in het Nederlands">
          <img src="../img/couv-cette-maison.jpg" alt="Omslag — Cette maison">
          <span class="etiket binnenkort">Binnenkort</span>
        </a>
        <a class="livre" href="tweemoment.html" aria-label="Een moment, of Twee — lees mee">
          <img src="../img/couv-un-instant.png" alt="Omslag — Een moment, of Twee...">
          <span class="etiket">Lees mee ›</span>
        </a>
        <a class="livre soon" href="#" aria-label="De Doodsklok — binnenkort">
          <img src="../img/couv-cloche.png" alt="Omslag — De Doodsklok">
          <span class="etiket binnenkort">Binnenkort</span>
        </a>
      </div>

      <div class="livres livres-bas">
        <a class="livre soon" href="#" aria-label="Drie Momenten — binnenkort">
          <img src="../img/couv-trois-instants.png" alt="Omslag — Drie Momenten">
          <span class="etiket binnenkort">Binnenkort</span>
        </a>
        <a class="livre soon" href="#" aria-label="Binnenkort">
          <img src="../img/couv-5.png" alt="Omslag — binnenkort">
          <span class="etiket binnenkort">Binnenkort</span>
        </a>
        <a class="livre soon" href="#" aria-label="Binnenkort">
          <img src="../img/couv-6.png" alt="Omslag — binnenkort">
          <span class="etiket binnenkort">Binnenkort</span>
        </a>
      </div>

    </div>

    <!-- Foto van de auteur -->
    <section class="auteur-blok">
      <img class="auteur-foto" src="img/auteur2.png" alt="Roy van Mil">
      <p class="auteur-naam">Roy van Mil</p>
      <p class="auteur-sub">Schrijver &amp; verhalenverteller</p>
    </section>

  </main>

</body>
</html>
